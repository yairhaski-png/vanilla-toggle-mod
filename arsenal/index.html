<title>ארסנל</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: language-app shell. Phone: sticky stat bar, zig-zag path of round 3D nodes, fixed bottom tabs.
   Laptop (>=1000px): three columns — nav sidebar | path | stats & cards. Lessons open full-screen. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F7F7F7; --ink:#3C3C3C; --ink-strong:#4B4B4B; --muted:#6F6F6F;
  --line:#E5E5E5; --line-2:#D6D6D6;
  --green:#58C21B; --green-d:#45A00A; --green-bg:#D7FFB8; --green-ink:#4A9E12;
  --blue:#1EA5F0;  --blue-d:#1683C0;  --blue-bg:#DDF4FF; --blue-line:#84D8FF;
  --red:#FF4F4F;   --red-d:#E03A3A;   --red-bg:#FFDFE0;  --red-ink:#EA2B2B;
  --gold:#FFC800;  --gold-d:#E3A600;
  --orange:#FF9B1A; --gem:#1EA5F0; --heart:#FF4F4F;
  --locked:#E5E5E5; --locked-d:#CDCDCD; --locked-i:#AFAFAF;
  --font:"Rubik","Assistant",system-ui,-apple-system,"Arial Hebrew",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131F24; --surface:#131F24; --soft:#1B2B32; --ink:#F1F7FB; --ink-strong:#F1F7FB; --muted:#8FA1AA;
  --line:#37464F; --line-2:#2A3940;
  --green-bg:#1F3A12; --green-ink:#79D93C; --blue-bg:#16324A; --blue-line:#3F86B5; --red-bg:#3D1C1F; --red-ink:#FF7A7A;
  --locked:#37464F; --locked-d:#27353C; --locked-i:#52656D; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131F24; --surface:#131F24; --soft:#1B2B32; --ink:#F1F7FB; --ink-strong:#F1F7FB; --muted:#8FA1AA;
  --line:#37464F; --line-2:#2A3940;
  --green-bg:#1F3A12; --green-ink:#79D93C; --blue-bg:#16324A; --blue-line:#3F86B5; --red-bg:#3D1C1F; --red-ink:#FF7A7A;
  --locked:#37464F; --locked-d:#27353C; --locked-i:#52656D; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;direction:rtl;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;user-select:none;-webkit-user-select:none;background:none;border:none;padding:0}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
svg{flex:none}

/* ---------- 3D buttons (shared) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:13px 20px;font-weight:800;font-size:16px;letter-spacing:.04em;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);transition:filter .1s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.ghost{background:var(--surface);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled{background:var(--locked);color:var(--locked-i);box-shadow:0 4px 0 var(--locked-d);cursor:default;transform:none;filter:none}
.btn.wide{width:100%}

/* ---------- shell */
.shell{min-height:100%}
.side-nav{position:fixed;inset:auto 0 0;z-index:8;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.side-nav .logo{display:none}
.nav-list{display:flex;justify-content:space-around;gap:4px;padding-block:6px}
.nav-item{display:flex;align-items:center;justify-content:center;gap:16px;border:2px solid transparent;border-radius:14px;padding:6px 14px;font-weight:700;font-size:15px;letter-spacing:.03em;color:var(--muted)}
.nav-item svg{width:32px;height:32px}
.nav-item span{display:none}
.nav-item[aria-current="page"]{border-color:var(--blue-line);background:var(--blue-bg);color:var(--blue)}
.nav-item:hover:not([aria-current]){background:var(--soft)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:7;background:var(--surface);border-bottom:2px solid var(--line)}
.statrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto}
.stat{display:flex;align-items:center;gap:6px;font-weight:800;font-size:17px;padding:6px 8px;border-radius:12px;font-variant-numeric:tabular-nums}
.stat svg{width:28px;height:28px}
.stat.streak{color:var(--orange)} .stat.streak.off{color:var(--locked-i)}
.stat.gems{color:var(--gem)} .stat.hearts{color:var(--heart)}
.course-flag{width:34px;height:26px;border-radius:6px;border:2px solid var(--line);overflow:hidden;display:block}

main{padding:0 max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.col{max-width:600px;margin:0 auto}
.aside{display:none}

@media (min-width:1000px){
  .shell{display:grid;grid-template-columns:250px minmax(0,1fr) 360px;gap:0 40px;max-width:1280px;margin:0 auto}
  .side-nav{position:sticky;top:0;inset:auto;height:100vh;border-top:none;border-inline-end:2px solid var(--line);padding:24px 16px;align-self:start}
  .side-nav .logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:30px;color:var(--green);letter-spacing:-.5px;padding:0 14px 28px}
  .side-nav .logo svg{width:42px;height:42px}
  .nav-list{flex-direction:column;justify-content:flex-start;gap:8px}
  .nav-item{justify-content:flex-start;padding:10px 14px}
  .nav-item span{display:inline}
  .topbar{display:none}
  main{padding:24px 0 60px}
  .aside{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;align-self:start;padding-block:24px;max-height:100vh;overflow:auto}
  .aside .statrow{padding:0;margin:0}
}

/* ---------- cards (aside + profile) */
.card{border:2px solid var(--line);border-radius:16px;padding:18px 20px;background:var(--surface)}
.card h3{margin:0 0 12px;font-size:20px;font-weight:800;color:var(--ink-strong);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 a,.card h3 button{font-size:14px;color:var(--blue);font-weight:800;letter-spacing:.03em}
.card p{margin:0;color:var(--muted);font-weight:500}
.pbar{position:relative;height:18px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar>i{position:absolute;inset:0 0 0 auto;border-radius:99px;background:var(--gold);transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.pbar>i::after{content:"";position:absolute;top:4px;inset-inline:8px;height:5px;border-radius:9px;background:rgb(255 255 255 / .35)}
.pbar>span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted)}
.rank-row{display:flex;align-items:center;gap:14px}
.rank-badge{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:var(--soft)}
.rank-badge svg{width:40px;height:40px}

/* ---------- path */
.unit{margin-top:26px}
.unit:first-child{margin-top:8px}
.unit-head{display:flex;align-items:center;gap:12px;color:#fff;background:var(--u);border-radius:16px;padding:16px 18px;box-shadow:0 4px 0 var(--u-d)}
.unit-head .t{flex:1;min-width:0}
.unit-head .eyebrow{font-size:14px;font-weight:800;opacity:.8;letter-spacing:.06em}
.unit-head h2{margin:2px 0 0;font-size:21px;font-weight:800;line-height:1.25}
.guide{display:flex;align-items:center;gap:8px;border:2px solid rgb(0 0 0 / .14);border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px;letter-spacing:.04em;color:#fff;box-shadow:0 3px 0 rgb(0 0 0 / .14)}
.guide svg{width:24px;height:24px;fill:#fff}
.guide:active{transform:translateY(3px);box-shadow:none}
@media (max-width:420px){.guide span{display:none}.guide{padding:10px}}

.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:44px 16px}
.nw{position:relative;display:grid;place-items:center;width:110px;height:104px}
.node{position:relative;width:72px;height:66px;border-radius:50%;background:var(--u);box-shadow:0 8px 0 var(--u-d);display:grid;place-items:center;transition:transform .08s,box-shadow .08s,filter .1s}
.node:hover{filter:brightness(1.05)}
.node:active{transform:translateY(6px);box-shadow:0 2px 0 var(--u-d)}
.node svg{width:36px;height:36px;fill:#fff}
.node.done{background:var(--gold);box-shadow:0 8px 0 var(--gold-d)}
.node.locked{background:var(--locked);box-shadow:0 8px 0 var(--locked-d);cursor:not-allowed}
.node.locked svg{fill:var(--locked-i)}
.node.chest,.node.chest.locked,.node.chest.done{background:none;box-shadow:none;width:86px;height:78px}
.node.chest svg{width:86px;height:78px}
.node.chest.locked{filter:grayscale(1) opacity(.55)}
.ring{position:absolute;inset:0;width:110px;height:104px;pointer-events:none}
.start{position:absolute;top:-40px;z-index:2;white-space:nowrap;border:2px solid var(--line);background:var(--surface);color:var(--u);font-weight:800;font-size:15px;letter-spacing:.05em;padding:8px 14px;border-radius:12px;animation:bob 1.3s ease-in-out infinite}
.start::after{content:"";position:absolute;bottom:-8px;left:50%;width:12px;height:12px;background:var(--surface);border:2px solid var(--line);border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-5px)}}
.me-av{width:84px;height:84px}
.buddy{position:absolute;top:120px;width:130px;height:130px;pointer-events:none}
.path-end{text-align:center;color:var(--muted);font-weight:600;padding-block:30px}

/* ---------- pages */
.page-title{font-size:26px;font-weight:800;margin:20px 0 6px;color:var(--ink-strong)}
.page-sub{color:var(--muted);margin:0 0 20px;font-weight:500}
.list{display:grid;gap:0;border:2px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:16px;padding:16px 18px;border-top:2px solid var(--line)}
.li:first-child{border-top:none}
.li .ic{flex:none;width:70px;height:70px;display:grid;place-items:center;border-radius:50%;background:var(--c,var(--soft))}
.li .ic svg{width:40px;height:40px}
.li.off .ic{background:var(--locked)} .li.off .ic svg{filter:grayscale(1);opacity:.5}
.li .t{flex:1;min-width:0}
.li b{display:block;font-size:18px;font-weight:700;color:var(--ink-strong)}
.li small{display:block;color:var(--muted);font-size:15px;font-weight:500;margin-bottom:8px}
.li .btn{padding:10px 14px;font-size:14px;white-space:nowrap}
.stats4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.tile svg{width:28px;height:28px}
.tile b{display:block;font-size:19px;font-weight:800;color:var(--ink-strong);line-height:1.1}
.tile small{color:var(--muted);font-weight:500}
.goal-opts{display:grid;gap:10px}
.goal-opt{display:flex;justify-content:space-between;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px 16px;font-weight:700}
.goal-opt[aria-pressed="true"]{border-color:var(--blue-line);background:var(--blue-bg);color:var(--blue)}
.week{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .b{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--line);min-height:6px}
.week .b.on{background:var(--orange)}
.week small{font-size:12px;color:var(--muted);font-weight:700}
.danger{color:var(--red-ink);font-weight:800;letter-spacing:.03em;padding:14px;width:100%;margin-top:22px;border:2px solid var(--line);border-radius:14px}

/* ---------- armory */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.chip{flex:none;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--blue-line);background:var(--blue-bg);color:var(--blue)}
.arm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.arm-card{display:flex;flex-direction:column;text-align:start;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;overflow:hidden;background:var(--surface)}
.arm-card:hover{background:var(--soft)}
.arm-card:active{border-bottom-width:2px;transform:translateY(2px)}
.sil-box{position:relative;background:var(--soft);display:grid;place-items:center;padding:14px 10px;color:var(--ink-strong)}
.sil{width:100%;max-width:260px;height:auto;aspect-ratio:240/90}
.gen{position:absolute;bottom:6px;inset-inline-start:8px;font-size:11px;font-weight:700;color:var(--muted)}
.arm-meta{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.arm-meta b{font-size:18px;font-weight:800;color:var(--ink-strong)}
.arm-meta small{color:var(--muted);font-weight:500}
.arm-meta .cal{align-self:flex-start;margin-top:6px;font-size:13px;font-weight:700;background:var(--blue-bg);color:var(--blue);padding:2px 8px;border-radius:8px}
.big-sil{border-radius:16px;margin-bottom:14px}
.spec{width:100%;border-collapse:collapse;margin:12px 0}
.spec th,.spec td{text-align:start;padding:9px 4px;border-bottom:2px solid var(--line);font-size:16px;vertical-align:top}
.spec th{color:var(--muted);font-weight:600;width:38%}
.spec td{font-weight:700;color:var(--ink-strong)}
.fact{border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:18px;background:var(--soft)}
.fact b{color:var(--orange)} .fact p{margin:2px 0 0;font-weight:500}
.id-card{border:2px solid var(--line);border-radius:18px;background:var(--soft);padding:20px 14px;display:grid;place-items:center;margin-bottom:20px;color:var(--ink-strong)}
.id-card .sil{max-width:420px}
.id-opts{grid-template-columns:1fr 1fr}
@media (max-width:420px){.id-opts .opt{font-size:16px;padding:12px}}

/* ---------- modal sheet */
.overlay{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .45);display:grid;place-items:end center;padding:0}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:24px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));animation:rise .25s ease-out}
@media (min-width:700px){.overlay{place-items:center}.sheet{border-radius:20px}}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 4px;font-size:24px;font-weight:800;color:var(--ink-strong)}
.sheet .center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.sheet .big{width:150px;height:140px}
.tips{display:grid;gap:12px;margin:16px 0 20px}
.tip{border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.tip b{display:block;font-size:14px;color:var(--u);letter-spacing:.04em;margin-bottom:2px}
.tip p{margin:0;font-weight:500}

/* ---------- lesson */
.lesson{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.l-top{display:flex;align-items:center;gap:16px;width:100%;max-width:1000px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.l-top .x svg{width:30px;height:30px;fill:var(--locked-i)}
.l-top .pbar{flex:1;height:16px}
.l-top .pbar>i{background:var(--green)}
.l-top .stat{padding:0}
.combo{position:absolute;top:-24px;inset-inline-end:0;font-size:13px;font-weight:800;color:var(--orange);letter-spacing:.04em}
.l-body{flex:1;overflow-y:auto;display:flex;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.l-inner{width:100%;max-width:600px;display:flex;flex-direction:column}
@media (min-width:700px){.l-inner{justify-content:center;min-height:100%}}
.l-kicker{font-size:14px;font-weight:800;letter-spacing:.05em;color:var(--purple,#A55FD8);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.l-title{margin:0 0 22px;font-size:26px;font-weight:800;color:var(--ink-strong);line-height:1.25;text-wrap:balance}
.speak{display:flex;align-items:flex-end;gap:8px;margin-bottom:26px}
.speak .who{width:120px;height:120px;margin-bottom:-6px}
.bubble{position:relative;flex:1;min-width:0;border:2px solid var(--line);border-radius:16px;padding:14px 18px;font-size:19px;font-weight:500;line-height:1.4;margin-bottom:34px;color:var(--ink-strong)}
.bubble::before{content:"";position:absolute;bottom:20px;right:-10px;width:16px;height:16px;background:var(--surface);border:2px solid var(--line);border-left:0;border-bottom:0;transform:rotate(45deg)}
@media (max-width:420px){.speak .who{width:84px;height:84px}.bubble{font-size:17px}.l-title{font-size:22px}}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:14px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;font-size:18px;font-weight:500;color:var(--ink-strong);background:var(--surface)}
.opt:hover:not(:disabled){background:var(--soft)}
.opt:active:not(:disabled){border-bottom-width:2px;transform:translateY(2px)}
.opt .k{flex:none;width:30px;height:30px;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;font-size:14px;font-weight:700;color:var(--muted)}
.opt.sel{border-color:var(--blue-line);background:var(--blue-bg);color:var(--blue)}
.opt.sel .k{border-color:var(--blue-line);color:var(--blue)}
.opt.right{border-color:var(--green);background:var(--green-bg);color:var(--green-ink)}
.opt.right .k{border-color:var(--green);color:var(--green-ink)}
.opt.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red-ink)}
.opt.wrong .k{border-color:var(--red);color:var(--red-ink)}
.opt:disabled{cursor:default}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{flex-direction:column;justify-content:center;padding:22px 10px;font-size:20px;font-weight:700}
.tf .opt svg{width:48px;height:48px;fill:currentColor}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pairs .c{display:grid;gap:12px;align-content:start}
.pairs .opt{justify-content:center;text-align:center;min-height:60px;font-size:17px}
.pairs .opt.gone{opacity:.4;border-bottom-width:2px;color:var(--locked-i);background:var(--surface)}

.l-foot{border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.l-foot.ok{background:var(--green-bg);border-color:transparent}
.l-foot.no{background:var(--red-bg);border-color:transparent}
.l-foot .in{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding:18px max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.l-foot .in{flex-direction:row;align-items:center;justify-content:space-between;padding-block:30px;min-height:140px}.l-foot .btn{width:auto;min-width:180px}}
.fb{display:none;align-items:flex-start;gap:14px}
.l-foot.ok .fb,.l-foot.no .fb{display:flex}
.fb .ic{flex:none;width:64px;height:64px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.fb .ic svg{width:38px;height:38px}
.l-foot.ok .fb .ic svg{fill:var(--green)} .l-foot.no .fb .ic svg{fill:var(--red)}
.fb .t{min-width:0}
.fb strong{display:block;font-size:24px;font-weight:800}
.l-foot.ok .fb{color:var(--green-ink)} .l-foot.no .fb{color:var(--red-ink)}
.fb span{display:block;font-size:16px;font-weight:500}
.l-foot.ok .btn{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.l-foot.no .btn{background:var(--red);box-shadow:0 4px 0 var(--red-d)}

.done-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding-block:20px}

.res{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:440px;margin-top:10px}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* ---------- motion & stages */
.unit-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:4}
@media (min-width:1000px){.unit-head{top:12px}}
.nw.popped{z-index:8}
.nw.intro>.node{animation:nodeIn .55s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(var(--d)*70ms)}
@keyframes nodeIn{from{transform:scale(.2) translateY(20px);opacity:0}}
.node.cur{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{filter:brightness(1.12) drop-shadow(0 0 10px color-mix(in srgb,var(--u) 60%,transparent))}}
.node.done{overflow:hidden}
.node.done::after{content:"";position:absolute;top:-20%;bottom:-20%;width:26px;background:linear-gradient(90deg,transparent,rgb(255 255 255 / .55),transparent);transform:skewX(-20deg);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%{right:-40px}35%,100%{right:120px}}
.ring-fill{animation:ringIn .9s ease-out backwards .2s}
@keyframes ringIn{from{stroke-dasharray:0 400}}
.stage-chip{position:absolute;bottom:2px;inset-inline-start:2px;background:var(--surface);color:var(--u);border:2px solid var(--line);border-radius:99px;font-size:12px;font-weight:800;padding:0 7px;line-height:20px}
.pop{position:absolute;top:100%;left:50%;width:min(270px,82vw);transform:translateX(calc(-50% + var(--shift,0px)));margin-top:10px;z-index:9;background:var(--u);color:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgb(0 0 0 / .2);animation:popIn .22s cubic-bezier(.3,1.5,.5,1);transform-origin:top center}
.pop::before{content:"";position:absolute;top:-8px;left:calc(50% + var(--arrow,0px));width:16px;height:16px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.pop.off{background:var(--soft);color:var(--muted);border:2px solid var(--line)}
.pop.off::before{border-left:2px solid var(--line);border-top:2px solid var(--line)}
@keyframes popIn{from{opacity:0;transform:translateX(calc(-50% + var(--shift,0px))) scale(.7)}}
.pop b{font-size:19px;font-weight:800}
.pop p{margin:0;font-weight:500;opacity:.92;font-size:15px}
.pop-btn{margin-top:4px;background:#fff;color:var(--u);border-radius:14px;padding:12px;font-weight:800;letter-spacing:.04em;box-shadow:0 4px 0 rgb(0 0 0 / .18)}
.pop-btn:active{transform:translateY(4px);box-shadow:none}
.pop-btn:disabled{background:var(--locked);color:var(--locked-i);box-shadow:0 4px 0 var(--locked-d)}
.stage-dots{display:flex;gap:6px}
.stage-dots i{flex:1;height:8px;border-radius:9px;background:rgb(255 255 255 / .3)}
.stage-dots i.on{background:#fff}

/* mascot */
.kd{overflow:visible}
.kd .kd-all{transform-box:view-box;transform-origin:60px 112px;animation:kdIdle 2.6s ease-in-out infinite}
.kd .kd-eyes{transform-box:view-box;transform-origin:60px 62px;animation:blink 4.2s infinite}
.kd .kd-arm-l{transform-box:view-box;transform-origin:96px 68px}
.kd.happy .kd-arm-l{animation:wave 1.2s ease-in-out infinite}
@keyframes kdIdle{50%{transform:translateY(-3px) scaleY(1.02)}}
@keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.08)}}
@keyframes wave{50%{transform:rotate(-24deg)}}
.kd.jump .kd-all{animation:kdJump .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes kdJump{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(4px) scale(1.08,.9)}55%{transform:translateY(-22px) scale(.95,1.06)}100%{transform:translateY(0) scale(1)}}

@keyframes kdSad{30%{transform:rotate(-8deg) translateY(3px)}60%{transform:rotate(6deg)}100%{transform:none}}
.buddy .kd-all{animation-duration:3.2s}

/* lesson motion */
.q-anim>*{animation:qIn .38s cubic-bezier(.2,.9,.3,1) backwards}
.q-anim>*:nth-child(2){animation-delay:.05s}.q-anim>*:nth-child(3){animation-delay:.1s}
@keyframes qIn{from{opacity:0;transform:translateX(-28px)}}
.opts .opt,.pairs .opt{animation:optIn .4s cubic-bezier(.3,1.4,.5,1) backwards;animation-delay:calc(.15s + var(--d,0)*.06s)}
@keyframes optIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
.opt.right{animation:okPop .45s cubic-bezier(.3,1.8,.5,1)}

.opt.wrong{animation:shake .4s}
.l-foot.ok .fb,.l-foot.no .fb{animation:fbIn .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes fbIn{from{opacity:0;transform:translateY(16px)}}
.l-foot.ok,.l-foot.no{animation:footIn .25s ease-out}
@keyframes footIn{from{transform:translateY(40%)}}
.l-foot.ok .fb .ic,.l-foot.no .fb .ic{animation:icPop .5s cubic-bezier(.3,1.8,.5,1) .05s backwards}
@keyframes icPop{from{transform:scale(0) rotate(-90deg)}}
.l-prog{flex:1;position:relative;display:flex;flex-direction:column;gap:6px}
.pbar.big{height:18px}
.l-prog .pbar.big{flex:none;height:18px}
.pbar.big>i{background:var(--green);transition:width .6s cubic-bezier(.3,1.3,.5,1)}
.pbar.big>i.hot{background:linear-gradient(90deg,#FF9B1A,#FFC800);animation:hot 1s ease-in-out infinite}
@keyframes hot{50%{box-shadow:0 0 14px #FF9B1A}}
.combo{position:absolute;top:-26px;inset-inline-start:0;display:flex;align-items:center;gap:3px;font-size:14px;font-weight:800;color:var(--orange);letter-spacing:.03em;animation:comboIn .4s cubic-bezier(.3,1.8,.5,1)}
.combo svg{width:18px;height:18px}
@keyframes comboIn{from{transform:scale(.3);opacity:0}}
.timer{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.timer>i{display:block;height:100%;background:var(--orange);border-radius:9px;transform-origin:right;animation:tdown linear forwards}
@keyframes tdown{from{transform:scaleX(1)}to{transform:scaleX(0);background:var(--red)}}
.l-kicker.legend{color:var(--orange)} .l-kicker svg{width:18px;height:18px}
.hearts.hit{animation:heartHit .5s}
@keyframes heartHit{20%{transform:scale(1.35)}40%{transform:scale(.9) rotate(-10deg)}60%{transform:scale(1.1) rotate(8deg)}}
.spark{position:fixed;z-index:70;width:10px;height:10px;border-radius:3px;pointer-events:none}
.float-t{position:fixed;z-index:70;pointer-events:none;font-weight:900;font-size:18px;display:flex;align-items:center;gap:2px;white-space:nowrap}
.float-t svg{fill:currentColor}
.btn.orange{background:var(--orange);box-shadow:0 4px 0 #DA7C00}

/* end screens */
.big-kd{width:200px!important;height:200px!important}
.pop-in{animation:popIn2 .5s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(.15s + var(--d,0)*.12s)}
@keyframes popIn2{from{opacity:0;transform:scale(.5) translateY(10px)}}
.flame-wrap{width:150px;height:150px;display:grid;place-items:center}
.flame{width:150px;height:150px;color:var(--orange);animation:flick 1.1s ease-in-out infinite,popIn2 .6s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(1.04,.96) rotate(-2deg)}60%{transform:scale(.97,1.05) rotate(2deg)}}
.streak-num{font-size:84px;font-weight:900;line-height:1;color:var(--orange);font-variant-numeric:tabular-nums}
.streak-num.flip{animation:flip .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes flip{0%{transform:translateY(-30px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.week-dots{display:flex;gap:10px;margin-top:8px}
.week-dots div{display:flex;flex-direction:column;align-items:center;gap:6px}
.week-dots small{font-weight:800;color:var(--muted)}
.week-dots i{width:34px;height:34px;border-radius:50%;background:var(--line);display:grid;place-items:center;animation:popIn2 .4s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(.6s + var(--d)*.07s)}
.week-dots i.on{background:var(--orange)}
.week-dots i.today{box-shadow:0 0 0 4px color-mix(in srgb,var(--orange) 35%,transparent)}
.week-dots svg{width:20px;height:20px;fill:#fff}
.rays-wrap{position:relative;width:220px;height:220px;display:grid;place-items:center}
.rays{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--gold) 40%,transparent) 0 12deg,transparent 12deg 30deg);mask:radial-gradient(circle,#000 30%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 9s linear infinite}
.rays.u{background:repeating-conic-gradient(color-mix(in srgb,var(--u) 40%,transparent) 0 12deg,transparent 12deg 30deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.medal-big{position:relative;width:130px;height:130px;animation:popIn2 .7s cubic-bezier(.3,1.7,.5,1)}
.chest-stage{height:150px;display:grid;place-items:center}
.chest-shake{animation:chestShake .3s ease-in-out infinite}
@keyframes chestShake{25%{transform:rotate(-6deg) scale(1.03)}75%{transform:rotate(6deg) scale(1.03)}}
.chest-pop{animation:popIn2 .5s cubic-bezier(.3,1.8,.5,1)}
/* ---------- round 6: tiles, voice, quests, league, hearts, onboarding */
.nav-item{position:relative}
.nav-item.dot::after{content:"";position:absolute;top:4px;inset-inline-end:8px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid var(--surface);animation:popIn2 .4s cubic-bezier(.3,1.6,.5,1)}

button.stat{cursor:pointer;border-radius:12px}
button.stat:hover{background:var(--soft)}
.linkish{color:var(--blue);font-weight:800}
.spk{float:inline-start;margin-inline-end:10px;width:38px;height:38px;border-radius:12px;background:var(--blue);display:grid;place-items:center;box-shadow:0 3px 0 var(--blue-d)}
.spk svg{width:22px;height:22px;fill:#fff}
.spk:active{transform:translateY(3px);box-shadow:none}
.spk.talk{animation:okPop .4s}
/* word tiles */
.build-line{min-height:118px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:6px 0;margin-bottom:22px;background:repeating-linear-gradient(to bottom,transparent 0 54px,var(--line) 54px 56px)}

.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tile{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 14px;font-size:18px;font-weight:500;color:var(--ink-strong);background:var(--surface);min-height:46px;animation:optIn .35s cubic-bezier(.3,1.4,.5,1) backwards;animation-delay:calc(.15s + var(--d,0)*.04s)}
.tile:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.tile.in{animation:tileIn .25s cubic-bezier(.3,1.6,.5,1)}
@keyframes tileIn{from{transform:translateY(30px) scale(.8);opacity:.3}}
.tile.used{background:var(--line);border-color:var(--line);color:transparent;pointer-events:none;animation:none}
/* quests */
.quest-list{display:grid;gap:16px}
.quest-row{display:flex;align-items:center;gap:12px}
.quest-row .qi{width:38px;height:38px;flex:none}
.quest-row .q-txt{flex:1;min-width:0}
.quest-row b{display:block;font-weight:700;margin-bottom:6px;color:var(--ink-strong)}
.q-chest{width:52px;height:48px;flex:none}
.q-chest svg{width:52px;height:48px}
.q-chest:disabled{cursor:default}
.q-chest:disabled:not(.ready) svg{filter:grayscale(.2)}
.q-chest.ready{animation:chestShake .5s ease-in-out infinite}
.q-banner{display:flex;align-items:center;gap:14px;margin-top:20px;padding:20px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#C27DF5,#8B5CF6);box-shadow:0 4px 0 #6D3FD6}
.q-banner h1{margin:0;font-size:24px;font-weight:800}
.q-banner p{margin:4px 0 0;font-weight:500;opacity:.95}
.qb-kd{width:96px;height:96px;flex:none}
/* league */
.shield{width:54px;height:60px}
.shield.sm{width:48px;height:52px;flex:none}

.board{border:2px solid var(--line);border-radius:16px;overflow:hidden}
.board .row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:2px solid var(--line);animation:qIn .35s backwards;animation-delay:calc(var(--d)*.04s)}
.board .row:first-child{border-top:none}
.board .row.me{background:var(--blue-bg)}
.board .pos{width:28px;text-align:center;font-weight:800;color:var(--muted);font-size:17px}
.board .pos.p1{color:#E3A600}.board .pos.p2{color:#9AA7B4}.board .pos.p3{color:#CD7F32}
.board .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;flex:none;overflow:hidden}

.board .nm{flex:1;min-width:0;font-weight:700;color:var(--ink-strong)}

.board .pts{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.board .row.me .nm,.board .row.me .pts{color:var(--blue)}
.zone{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px;font-size:13px;font-weight:800;letter-spacing:.04em;border-top:2px solid var(--line)}
.zone svg{width:16px;height:16px;fill:currentColor}
.zone.up{color:var(--green-ink);background:var(--green-bg)}
.zone.down{color:var(--red-ink);background:var(--red-bg)}
.league-msg{margin-bottom:14px;padding:12px 16px;border-radius:14px;font-weight:800;display:flex;gap:8px;align-items:center;justify-content:center;animation:popIn2 .5s cubic-bezier(.3,1.6,.5,1)}

.league-msg.up{background:var(--green-bg);color:var(--green-ink)} .league-msg.down{background:var(--red-bg);color:var(--red-ink)}
/* hearts sheet */

/* onboarding */
.onb{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:fadeIn .3s}

@keyframes fadeIn{from{opacity:0}} @keyframes fadeOut{to{opacity:0;transform:scale(1.03)}}
.onb-top{display:flex;align-items:center;gap:14px;width:100%;max-width:700px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.onb-top .x svg{width:30px;height:30px;fill:var(--locked-i)}
.onb-top .pbar>i{background:var(--green);transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.onb-body{flex:1;overflow-y:auto;width:100%;max-width:600px;margin:0 auto;padding:30px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:center}
.onb-body .speak.solo{flex-direction:column;align-items:center;text-align:center}

.onb-foot{border-top:2px solid var(--line)}

.miss-card{display:flex;align-items:center;gap:14px;margin-top:14px;padding:14px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;animation:qIn .4s backwards}

.gun .w{fill:url(#gWood)} .gun .m{fill:url(#gMetal)} .gun .p{fill:url(#gPoly)} .gun .s{fill:url(#gSteel)} .gun .od{fill:url(#gOD)} .gun .pl{fill:url(#gPlum)} .gun .o{fill:#4FC3F7}

.gun .hl{fill:#fff;opacity:.28}
.gun .tr{fill:#C9D6DE;opacity:.75;stroke:#8FA3B0;stroke-width:1}

.arm-card .sil-box{transition:transform .2s}

.id-card .sil{animation:gunIn .6s cubic-bezier(.3,1.4,.5,1) .1s backwards}
@keyframes gunIn{from{transform:translateX(-40px) rotate(-6deg);opacity:0}}
/* page transitions */
.tab-in{animation:tabIn .35s cubic-bezier(.2,.9,.3,1)}
@keyframes tabIn{from{opacity:0;transform:translateY(14px)}}
.stat.bump{animation:bump .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{30%{transform:scale(1.35)}}
.nav-item:active svg{transform:scale(.85)}
.nav-item svg{transition:transform .15s}
.nav-item[aria-current="page"] svg{animation:navPop .45s cubic-bezier(.3,1.8,.5,1)}

.splash{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--u,var(--green));color:#fff;text-align:center;animation:splashOut .28s ease-in .72s forwards;cursor:pointer}

.splash p{margin:0;font-size:18px;font-weight:700;opacity:.92;animation:popIn2 .5s cubic-bezier(.3,1.6,.5,1) .25s backwards}
.splash .pips{display:flex;gap:10px}
.splash .pips i{width:34px;height:34px;border-radius:50%;background:rgb(255 255 255 / .25);display:grid;place-items:center;animation:popIn2 .4s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(.35s + var(--d)*.1s)}
.splash .pips i.on{background:#fff}

.splash .pips svg{width:20px;height:20px;fill:var(--u,var(--green))}
@keyframes pulse{50%{transform:scale(1.15)}}
@keyframes splashOut{to{opacity:0;transform:scale(1.08);visibility:hidden}}
.part-sub{margin:-14px 0 16px;color:var(--muted);font-weight:500}
.part-card{padding:26px 10px}
.part-svg{max-width:520px!important;overflow:visible}
.hot{transform-box:fill-box;transform-origin:center;fill:transparent;stroke:transparent;stroke-width:2.2;cursor:pointer;transition:fill .15s}

.fc.on .fc-in{transform:rotateY(180deg)}

.uw-c svg{width:100%;height:auto;display:block}.uw-c small{display:block;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

 { id:"stories", c:["#D946EF","#A21CAF"], title:"סיפורים מאחורי הנשק", sub:"איך נולדו הנשקים המפורסמים", lessons:[
  { name:"הממציאים", qs:[
   {t:"story", w:"ak47", title:"החייל הפצוע שתכנן את הנשק הנפוץ בעולם", lines:["1941. מיכאיל קלשניקוב, מפקד טנק בצבא האדום, נפצע קשה בקרב מול הגרמנים.","בבית החולים הוא שמע חיילים מתלוננים על הנשק שלהם, והחליט לתכנן נשק טוב יותר.","אחרי כמה ניסיונות הדגם שלו נבחר, וב-1949 הוא נכנס לשירות בצבא הסובייטי: ה-AK-47.","בזקנתו אמר קלשניקוב שהיה מעדיף לתכנן מכונה שעוזרת לחקלאים, כמו מכסחת דשא."], q:"מה היה התפקיד של קלשניקוב כשנפצע?", a:["מפקד טנק","טייס קרב","מהנדס במפעל נשק","צלף"], c:0, e:"הניסיון שלו כחייל בשטח השפיע על התכנון הפשוט והאמין של הרובה."},
   {t:"story", w:"glock17", title:"מוטות וילון ואקדח אחד", lines:["ב-1980 צבא אוסטריה חיפש אקדח חדש.","גסטון גלוק היה מהנדס שהחברה שלו ייצרה מוטות לווילונות, סכינים ואתי חפירה לצבא, אבל אף פעם לא אקדח.","הוא אסף מומחים, למד את התחום, ובנה אקדח עם מסגרת מפולימר ומעט מאוד חלקים.","ב-1982 הגלוק 17 ניצח במבחנים ונבחר לצבא האוסטרי. היום הוא מהאקדחים הנפוצים בעולם."], q:"מה ייצרה החברה של גלוק לפני האקדח?", a:["מוטות וילון, סכינים ואתי חפירה","חלקי חילוף למכוניות","מחסניות לרובים","שעוני יד"], c:0, e:"דווקא חוסר הניסיון עזר לו: הוא לא היה כבול לדרך שבה אקדחים נבנו עד אז."},
   {t:"story", w:"m16", title:"רובה מחומרים של מטוסים", lines:["בשנות ה-50 עבד יוג'ין סטונר בארמלייט, חטיבה קטנה של חברת מטוסים אמריקנית.","במקום עץ ופלדה כבדה, הוא השתמש בחומרים מעולם התעופה: אלומיניום ופלסטיק.","התוצאה הייתה רובה קל במיוחד, ה-AR-15, שירה תחמושת קטנה ומהירה.","צבא ארה\"ב אימץ אותו בשם M16, ובגרסאות שונות הוא בשירות עד היום."], q:"מאיזה תחום הגיעו החומרים של ה-AR-15?", a:["תעשיית המטוסים","תעשיית הרכב","בניית ספינות","ייצור רהיטים"], c:0, e:"הגוף מאלומיניום והקת מפלסטיק הפכו אותו לקל בהרבה מרובי הקרב של אז."},
   {t:"story", w:"uzi", title:"השם שהממציא לא רצה", lines:["אחרי מלחמת העצמאות צה\"ל השתמש בתת-מקלעים מכמה מדינות, עם תחמושת וחלקים שונים.","עוזיאל גל, קצין בצה\"ל, תכנן תת-מקלע פשוט וזול שאפשר לייצר בישראל.","הרעיון החכם: המחסנית נכנסת לתוך ידית האחיזה, ולכן הנשק קצר ונוח.","גל ביקש שהנשק לא ייקרא על שמו, אבל הבקשה לא התקבלה, וב-1954 העוזי נכנס לשירות."], q:"מה ביקש עוזיאל גל בקשר לשם הנשק?", a:["שהנשק לא ייקרא על שמו","שייקרא על שם היחידה שלו","שייקרא על שם מדינת ישראל","שייקרא 'גל'"], c:0, e:"העוזי הפך לאחד מתת-המקלעים המפורסמים בעולם, ונמכר לעשרות מדינות."},
   {t:"vs", k:"year"}
  ]},
  { name:"רגעים בהיסטוריה", qs:[
   {t:"story", title:"הרופא שהמציא מקלע", lines:["ריצ'רד גטלינג היה רופא אמריקני, לא איש צבא.","במלחמת האזרחים הוא ראה שרוב החיילים מתים ממחלות, ולא בקרב.","הוא האמין שנשק שבו אדם אחד עושה עבודה של מאה יקטין את הצבאות, ולכן גם את מספר ההרוגים.","ב-1862 רשם פטנט על מקלע עם קנים מסתובבים. התקווה שלו לא התגשמה: המקלעים רק הפכו את המלחמות לקטלניות יותר."], q:"מה היה המקצוע של ריצ'רד גטלינג?", a:["רופא","מהנדס רכבות","קצין תותחנים","נפח"], c:0, e:"מקלע גטלינג הופעל בסיבוב ידית, ולכן הוא לא נחשב אוטומטי."},
   {t:"story", title:"מכלי מים סודיים", lines:["במלחמת העולם הראשונה פיתחו הבריטים בסוד כלי רכב משוריין על זחלים.","כדי לשמור על הסוד, אמרו לעובדים במפעלים שהם בונים מכלי מים לחזית.","באנגלית 'מכל' זה Tank, והשם נשאר עד היום.","בספטמבר 1916 הופיעו הטנקים לראשונה בקרב, בקרב על הסום."], q:"למה הכלי נקרא 'טנק'?", a:["כדי להסתיר שמדובר בכלי מלחמה","על שם הממציא שלו","כי הוא נשא דלק לחזית","על שם עיר בבריטניה"], c:0, e:"הטנקים הראשונים היו איטיים ונתקעו הרבה, אבל שינו את שדה הקרב."},
   {t:"story", title:"השם שבא מכלי נגינה", lines:["במלחמת העולם השנייה פיתחו האמריקנים משגר רקטות נגד טנקים שחייל אחד יכול לשאת.","החיילים שמו לב שהצינור הארוך דומה לכלי נגינה מאולתר של הקומיקאי בוב ברנס.","שם הכלי היה 'בזוקה', והכינוי נדבק לנשק."], q:"על שם מה נקראה הבזוקה?", a:["כלי נגינה של קומיקאי","הממציא שלה","העיר שבה יוצרה","סוג של רקטה רוסית"], c:0, e:"עד היום קוראים בדיבור 'בזוקה' לכל משגר רקטות שנישא על הכתף."},
   {t:"story", w:"galil", title:"פותחן הבקבוקים של הגליל", lines:["חיילים פותחים בקבוקים עם מה שיש להם ביד.","עם רובים ישנים הם השתמשו בשפת המחסנית, והמחסניות נפגעו ונתקעו.","מתכנני הגליל פתרו את זה בדרך פשוטה: הם שילבו פותחן בקבוקים בדו-רגלי של הרובה.","כך נשמרו המחסניות, והחיילים קיבלו פותחן."], q:"למה שולב פותחן בקבוקים בגליל?", a:["כדי שחיילים לא יפתחו בקבוקים עם המחסנית","כפרסומת לחברת משקאות","כדי לפתוח קופסאות שימורים","כדי לנקות את הקנה"], c:0, e:"זו דוגמה לתכנון שמתחשב באיך שחיילים באמת משתמשים בנשק."},
   {t:"story", title:"היירוט הראשון", lines:["אחרי שנים של פיתוח ברפאל, הוצבה ב-2011 סוללת כיפת ברזל ליד באר שבע.","באפריל 2011 שוגרה רקטת גראד לעבר העיר.","המערכת חישבה שהרקטה עומדת לפגוע באזור מיושב, ושיגרה טיל מיירט.","הרקטה יורטה באוויר. זה היה היירוט המבצעי הראשון של כיפת ברזל."], q:"איפה התרחש היירוט המבצעי הראשון של כיפת ברזל?", a:["ליד באר שבע","ליד חיפה","ליד אילת","ליד ירושלים"], c:0, e:"המערכת מיירטת רק רקטות שעומדות לפגוע באזור מיושב, וכך חוסכת טילים."}
  ]},
  { name:"מאחורי הקלעים", qs:[
   {t:"story", w:"barrett", title:"הצלם שבנה רובה", lines:["ב-1982 רוני בארט היה צלם מטנסי, בלי שום ניסיון בתכנון נשק.","יום אחד הוא צילם מסוק צבאי עם מקלעים כבדים בקליבר ‎.50, ותהה אם אפשר לבנות רובה שיורה את אותה תחמושת.","הוא שרטט את הרעיון בעצמו ובנה אב-טיפוס במוסך.","כך נולד ה-M82: רובה חצי-אוטומטי בקליבר ‎.50 שנמכר לעשרות צבאות."], q:"מה היה המקצוע של רוני בארט לפני שתכנן את הרובה?", a:["צלם","קצין בחיל הנחתים","מהנדס במפעל נשק","צלף משטרתי"], c:0, e:"ה-M82 נועד לפגוע בציוד כמו רכבים ומכ\"מים, ממרחק של יותר מקילומטר וחצי."},
   {t:"story", w:"thompson", title:"המטאטא שהגיע מאוחר", lines:["במלחמת העולם הראשונה, ג'ון ט. תומפסון רצה נשק קטן שיורה מהר, לניקוי תעלות. הוא קרא לו 'מטאטא התעלות'.","אבל הנשק היה מוכן רק אחרי שהמלחמה כבר נגמרה.","בשנות ה-20 הוא התפרסם דווקא בגלל כנופיות בתקופת היובש בארה\"ב, וקיבל את הכינוי 'טומי גאן'.","במלחמת העולם השנייה הוא חזר לשדה הקרב, הפעם בידי חיילים אמריקנים ובריטים."], q:"למה תוכנן התומפסון במקור?", a:["ללחימה בתעלות במלחמת העולם הראשונה","לשוטרים בתקופת היובש","לצלפים","לטייסים"], c:0, e:"התומפסון יורה תחמושת אקדח ‎.45 ACP, ולכן הוא תת-מקלע."},
   {t:"story", w:"deagle", title:"אקדח אמריקני מתוצרת ישראל", lines:["בתחילת שנות ה-80 חברת Magnum Research ממינסוטה תכננה אקדח חצי-אוטומטי לתחמושת מגנום חזקה.","כדי לייצר אותו הם פנו לתעשייה הצבאית בישראל, ושם יוצר הדזרט איגל שנים רבות.","בניגוד לרוב האקדחים, הוא עובד במנגנון גזים, כמו רובה.","הוא כבד מאוד ובעל רתע חזק, והתפרסם בעיקר בסרטים ובמשחקי מחשב."], q:"איפה יוצר הדזרט איגל במשך שנים רבות?", a:["בתעשייה הצבאית בישראל","במפעל של קולט","בגרמניה","באוסטריה"], c:0, e:"בקליבר ‎.50 AE יש במחסנית שלו רק 7 כדורים."},
   {t:"odd"}
  ]},
  { name:"אגדות מהשטח", qs:[
   {t:"story", w:"mosin", title:"המוות הלבן", lines:["1939. ברית המועצות פלשה לפינלנד, במה שנקרא 'מלחמת החורף'.","סימו הייהה, חקלאי וצייד פיני, שירת כצלף בשלג ובקור של 40 מעלות מתחת לאפס.","הוא ירה ברובה מוסין-נגאן עם כוונות פתוחות, בלי טלסקופ. עדשה יכולה לנצנץ בשמש ולגלות את מקומו.","הסובייטים כינו אותו 'המוות הלבן'. הוא נפצע קשה בלסת, החלים, וחי עד גיל 96."], q:"למה הייהה העדיף לירות בלי כוונת טלסקופית?", a:["עדשה יכולה לנצנץ ולגלות את מקומו","בפינלנד לא היו טלסקופים","הטלסקופ קפא ונשבר בכל ירי","הרובה שלו לא התאים לטלסקופ"], c:0, e:"בלי טלסקופ הוא גם יכול היה לשכב נמוך יותר מאחורי השלג."},
   {t:"story", w:"enfield", title:"הדקה המטורפת", lines:["לפני מלחמת העולם הראשונה, הצבא הבריטי אימן את חייליו בתרגיל שנקרא 'הדקה המטורפת'.","המטרה: לירות לפחות 15 יריות מכוונות בדקה אחת, ברובה בריח מסוג לי-אנפילד.","הבריח החלק של הרובה ומחסנית של 10 כדורים אפשרו קצב כזה.","לפי סיפורים מ-1914, הגרמנים שנתקלו בבריטים היו בטוחים שמולם יש מקלעים."], q:"כמה יריות מכוונות בדקה דרש התרגיל?", a:["לפחות 15","לפחות 5","לפחות 50","לפחות 100"], c:0, e:"היו חיילים מאומנים במיוחד שהגיעו גם ליותר מ-30."},
   {t:"story", title:"החייל שלא ידע שהמלחמה נגמרה", lines:["1944. הסגן היפני הירו אונודה נשלח לאי לובאנג בפיליפינים, עם פקודה לא להיכנע לעולם.","המלחמה נגמרה ב-1945, אבל הוא חשב שהעלונים שמודיעים על כך הם תרגיל של האויב, ונשאר בג'ונגל.","במשך כמעט 30 שנה הוא שמר על הרובה והמדים שלו במצב תקין.","ב-1974 טס אליו המפקד הקודם שלו מיפן ושחרר אותו מהפקודה. רק אז הוא הסכים לצאת."], q:"מה גרם לאונודה להסכים לצאת מהג'ונגל?", a:["המפקד הקודם שלו הגיע ושחרר אותו מהפקודה","הוא מצא עיתון יפני","נגמרה לו התחמושת","הרובה שלו נשבר"], c:0, e:"הוא הרגיש מחויב לפקודה, ורק מי שנתן אותה יכול היה לבטל אותה."},
   {t:"story", w:"ak47", title:"הרובה שעל הדגל", lines:["מוזמביק שבאפריקה קיבלה עצמאות מפורטוגל ב-1975, אחרי שנים של מלחמת שחרור.","הלוחמים שלה השתמשו הרבה ב-AK-47, והוא הפך לסמל של המאבק.","על הדגל של מוזמביק מופיעים ספר, מעדר ורובה AK עם כידון.","זו המדינה היחידה בעולם שעל הדגל שלה יש רובה סער מודרני."], q:"מה מופיע על דגל מוזמביק לצד ה-AK?", a:["ספר ומעדר","חרב ומגן","כוכב וסהר","עץ ונשר"], c:0, e:"הספר מסמל חינוך, המעדר חקלאות, והרובה את ההגנה על המדינה."},
   {t:"vs", k:"year"}
  ]}
 ]},

   {t:"tf", q:"ברוח צד, מכוונים מעט לכיוון שממנו נושבת הרוח.", c:true, e:"הרוח דוחפת את הקליע הצידה, ולכן מקדימים אותה. זה נקרא 'תיקון רוח'."},
   {t:"mc", q:"מה עושה ה'חריקה' בתוך הקנה לקליע?", a:["גורמת לו להסתובב, וכך הוא יציב ומדויק יותר","מאיטה אותו","מחממת אותו","מקצרת את הטווח"], c:0, e:"קליע מסתובב מתנהג כמו סביבון, ולא מתהפך באוויר."},

  ]}
 ]},

let AC=null, MASTER=null;
function audio(){
  if(S&&S.mute) return null;

}

/* one voice: osc type, start freq, end freq (glide), when, length, peak gain, optional lowpass */
function voice(type,f1,f2,when,len,peak,lp){
  const a=audio(); if(!a) return; const t=a.currentTime+when;
  const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f1,t); if(f2&&f2!==f1) o.frequency.exponentialRampToValueAtTime(f2,t+len*.8);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+len);
  let node=o; if(lp){ const f=a.createBiquadFilter(); f.type="lowpass"; f.frequency.value=lp; o.connect(f); node=f; }
  node.connect(g).connect(MASTER); o.start(t); o.stop(t+len+.05);
}

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#confetti"),x=c.getContext("2d"),d=devicePixelRatio||1;c.hidden=false;
  const W=c.width=innerWidth*d,H=c.height=innerHeight*d;
  const cols=["#58C21B","#1EA5F0","#FFC800","#FF4F4F","#C27DF5","#FF9B1A"];
  const P=Array.from({length:160},()=>({x:W/2+(Math.random()-.5)*W*.4,y:H*.4,vx:(Math.random()-.5)*18*d,vy:(-Math.random()*18-6)*d,r:(Math.random()*6+5)*d,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[Math.random()*6|0]}));
  let f=0;(function step(){x.clearRect(0,0,W,H);for(const p of P){p.vy+=.5*d;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();}
    if(++f<160)requestAnimationFrame(step);else c.hidden=true;})();
}

  $$(".nav-item").forEach(b=>b.dataset.tab===tab?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  $("#topStats").innerHTML=statRow();
  $("#aside").innerHTML=`<div class="statrow">${statRow()}</div>${leagueCard()}${questsCard()}${rankCard()}`;
  const cur={streak:S.streak,gems:S.gems,hearts:S.hearts};
  if(render.prev) for(const k in cur) if(cur[k]!==render.prev[k]) $$(".stat."+k).forEach(e=>e.classList.add("bump"));
  render.prev=cur;
  if(render.lastTab!==tab){ const m=$("#main"); m.classList.remove("tab-in"); void m.offsetWidth; m.classList.add("tab-in"); render.lastTab=tab; }
  ({learn:renderLearn,armory:renderArmory,league:renderLeague,quests:renderQuests,badges:renderBadges,shop:renderShop,me:renderMe})[tab]();
  $$("[data-go]").forEach(b=>b.onclick=()=>{tab=b.dataset.go;render();scrollTo(0,0);});

/* ------------------------------------------------------------------ learn (path) */
const STAGES=f=>f.n.t==="lesson"?3:1;
const stageOf=f=>Math.min(S.done[f.key]||0,STAGES(f));
const isFull=f=>stageOf(f)>=STAGES(f);
const STAGE_NAME=["רגיל","מתקדם","אגדי"];
function nodeXP(f){const st=stageOf(f);if(f.n.t==="chest")return 0;if(isFull(f))return 5;return({lesson:10,review:15,test:25})[f.n.t]+(f.n.t==="lesson"?st*5:0);}
function renderLearn(){
  closePop();
  let h="", cur=FLAT.findIndex((f,i)=>isOpen(i)&&!isFull(f));
  const intro=!renderLearn.seen; renderLearn.seen=1;
  COURSE.forEach((u,ui)=>{
    const side=ui%2?-1:1;
    h+=`<section class="unit" style="${uv(u)}"><div class="unit-head"><div class="t"><div class="eyebrow">חלק 1, יחידה ${ui+1}</div><h2>${esc(u.title)}</h2></div>
      <button class="guide" data-guide="${ui}">${ico("i-book")}<span>מדריך</span></button></div><div class="path">`;
    const nodes=FLAT.filter(f=>f.ui===ui), N=nodes.length;
    nodes.forEach((f,j)=>{
      const gi=FLAT.indexOf(f), open=isOpen(gi), full=isFull(f), st=stageOf(f), isCur=gi===cur;
      const off=Math.round(Math.sin(j/(N-1)*Math.PI)*80*side);
      const icon=f.n.t==="review"?"i-dumbbell":f.n.t==="test"?"i-trophy":!open?"i-lock":full?"i-check":"i-star";
      const cls=`node ${f.n.t==="chest"?"chest":""} ${full?"done":""} ${!open?"locked":""} ${isCur?"cur":""} ${f.key===renderLearn.justDone?"just-done":""} ${f.key===renderLearn.justOpen?"just-open":""}`;
      const inner=f.n.t==="chest"?`<svg viewBox="0 0 86 78"><use href="#${full?"chest-open":"chest"}"/></svg>`:`<svg viewBox="0 0 24 24"><use href="#${icon}"/></svg>`;
      const ring=open&&!full&&f.n.t!=="chest"&&(isCur||st>0);
      const C=305, dash=Math.max(isCur&&st===0?0:4,C*st/STAGES(f));
      h+=`<div class="nw ${intro?"intro":""}" style="transform:translateX(${off}px);--d:${j}" data-off="${off}">
        ${ring?`<svg class="ring" viewBox="0 0 110 104"><ellipse cx="55" cy="55" rx="50" ry="47" fill="none" stroke="var(--line)" stroke-width="8"/>${dash?`<ellipse class="ring-fill" cx="55" cy="55" rx="50" ry="47" fill="none" stroke="var(--u)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${dash} 400" transform="rotate(-90 55 55)"/>`:""}</svg>`:""}
        ${isCur?`<div class="start">${f.n.t==="chest"?"פתח":st>0?"המשך":"התחל"}</div>`:""}
        <button class="${cls}" data-i="${gi}" aria-label="${esc(f.n.name)}${open?"":" (נעול)"}">${inner}</button>
        ${f.n.t==="lesson"&&open&&st>0&&!full?`<span class="stage-chip">${st}/3</span>`:""}</div>`;
    });
    h+=`${mascot("happy","buddy")}</div></section>`.replace('class="kd happy buddy"',`class="kd happy buddy" style="${side>0?"left":"right"}:0"`);
  });
  h+=`<p class="path-end">${lessonsDone()===LESSON_COUNT?"סיימת את כל הקורס. אפשר לחזור לכל שלב ולצבור עוד XP.":"יחידות נוספות בדרך"}</p>`;
  $("#main").innerHTML=wotdCard()+mistakesCard()+practiceTiles()+h;
  $("#wotdGo").onclick=openWotd;
  const mg=$("#missGo"); if(mg) mg.onclick=startMistakes;
  $("#partsGo").onclick=startPartsDrill;
  const xg=$("#expertGo"); if(xg) xg.onclick=startExpert;
  $("#blitzGo").onclick=startBlitz;
  $$(".node").forEach(b=>b.onclick=e=>{e.stopPropagation(); nodeTap(+b.dataset.i,b);});
  $$("[data-guide]").forEach(b=>b.onclick=()=>guide(COURSE[+b.dataset.guide]));
  const jo=$(".node.just-open")||$(".node.just-done");
  if(jo){ renderLearn.scrolled=1; jo.scrollIntoView({block:"center",behavior:RM()?"auto":"smooth"});
    const isOpenAnim=jo.classList.contains("just-open");
    setTimeout(()=>{ burst(jo,isOpenAnim?["#FFC800","#58C21B","#1EA5F0","#FF9B1A"]:["#FFC800","#FFE27A"],isOpenAnim?24:14); isOpenAnim?sfx.streak():sfx.pop(); }, isOpenAnim?900:450); }
  if(renderLearn.justOpen&&/:l0$/.test(renderLearn.justOpen)){ const f=FLAT.find(x=>x.key===renderLearn.justOpen); if(f) setTimeout(()=>unitBanner(f.u),1300); }
  renderLearn.justDone=renderLearn.justOpen=null;
  if(!renderLearn.scrolled){renderLearn.scrolled=1;const s=$(".start");if(s&&s.getBoundingClientRect().top>innerHeight*.7)s.scrollIntoView({block:"center"});}
}
function closePop(){ const p=$(".pop"); if(p){ p.parentElement.classList.remove("popped"); p.remove(); } }
document.addEventListener("click",e=>{ if(!e.target.closest(".pop")) closePop(); });
function nodeTap(i,btn){
  const f=FLAT[i], open=isOpen(i), wrap=btn.parentElement, already=wrap.querySelector(".pop");
  closePop(); if(already) return;
  sfx.tap();
  if(open&&f.n.t==="chest") return openChest(f);
  const off=+wrap.dataset.off, shift=Math.round(off*.75);
  let body;
  if(!open) body=`<b>${esc(f.n.name)}</b><p>סיים את השלבים הקודמים כדי לפתוח את השלב הזה</p><button class="pop-btn" disabled>נעול</button>`;
  else if(f.n.t==="lesson"){
    const st=stageOf(f), full=isFull(f);
    body=`<b>${esc(f.n.name)}</b><p>${full?"השלמת את כל 3 השלבים. אפשר לתרגל שוב.":`שלב ${st+1} מתוך 3 · ${STAGE_NAME[st]}${st===2?" (עם שעון)":""}`}</p>
      <div class="stage-dots">${[0,1,2].map(k=>`<i class="${k<st?"on":""}"></i>`).join("")}</div>
      <button class="pop-btn" id="popGo">${full?"תרגול":"התחל"} +${nodeXP(f)} XP</button>${st>0?`<button class="pop-learn" id="popLearn">${ico("i-book")}חזרה על החומר</button>`:""}`;
  } else body=`<b>${esc(f.n.name)}</b><p>${f.n.t==="review"?"6 שאלות מכל היחידה":"15 שאלות מכל היחידה. תצליח, ותקבל גביע."}</p><button class="pop-btn" id="popGo">${isFull(f)?"תרגול":"התחל"} +${nodeXP(f)} XP</button>`;
  const pop=document.createElement("div");
  pop.className="pop"+(open?"":" off"); pop.style.cssText=`--shift:${-shift}px;--arrow:${shift}px`;
  pop.innerHTML=body; pop.onclick=e=>e.stopPropagation(); wrap.appendChild(pop); wrap.classList.add("popped");
  const go=pop.querySelector("#popGo"); if(go) go.onclick=()=>{closePop();startLesson(f);};
  const lr=pop.querySelector("#popLearn"); if(lr) lr.onclick=()=>{ closePop(); startLesson(f); const wait=setInterval(()=>{ if(!L){clearInterval(wait);return;} if(L.state==="answer"&&$(".l-inner")){ clearInterval(wait); if(L.teach&&L.teach.length) startTeach(); } },60); };
  const r=pop.getBoundingClientRect(); if(r.bottom>innerHeight-90) scrollBy({top:r.bottom-innerHeight+110,behavior:"smooth"});
}

/* ------------------------------------------------------------------ overlays */
function sheet(html,style=""){ const o=$("#overlay"); o.innerHTML=`<div class="sheet" style="${style}" role="dialog" aria-modal="true">${html}</div>`; o.hidden=false;
  o.onclick=e=>{if(e.target===o)closeSheet();}; }
function closeSheet(){ $("#overlay").hidden=true; $("#overlay").innerHTML=""; }
function guide(u){
  const tips=u.lessons.flatMap(l=>l.qs.filter(q=>q.e).map(q=>({l:l.name,e:q.e})));
  sheet(`<h2>מדריך: ${esc(u.title)}</h2><p class="page-sub" style="margin:0">${esc(u.sub)}. הנקודות החשובות ביחידה:</p>
    <div class="tips">${tips.map(t=>`<div class="tip"><b>${esc(t.l)}</b><p>${esc(t.e)}</p></div>`).join("")}</div>
    <button class="btn wide" id="sx">הבנתי</button>`,uv(u));
  $("#sx").onclick=closeSheet;
}
function openChest(f){
  const g=10+(Math.random()*11|0), full=isFull(f);
  sheet(`<div class="center"><div class="chest-stage"><svg class="big chest-shake" id="chestSvg" viewBox="0 0 86 78"><use href="#chest"/></svg></div>
    <h2 id="chT">${full?"התיבה כבר נפתחה":"תיבת אוצר!"}</h2><p class="page-sub" style="margin:0" id="chP">${full?"כבר אספת את היהלומים מכאן.":"פותחים..."}</p>
    <button class="btn wide blue" id="sx" ${full?"":"disabled"}>${full?"סגור":"אסוף"}</button></div>`);
  $("#sx").onclick=()=>{ if(!full&&!isDone(f)){S.gems+=g;S.done[f.key]=1;save();} closeSheet(); render(); };
  if(full){$("#chestSvg").classList.remove("chest-shake");$("#chestSvg use").setAttribute("href","#chest-open");return;}
  setTimeout(()=>{ const c=$("#chestSvg"); if(!c)return; c.classList.remove("chest-shake"); c.classList.add("chest-pop"); c.querySelector("use").setAttribute("href","#chest-open");
    $("#chT").textContent="מצאת אוצר!"; $("#chP").innerHTML=`קיבלת <b style="color:var(--gem)">${g} יהלומים</b>. אפשר להשתמש בהם בחנות.`;
    $("#sx").disabled=false; burst(c,["#1EA5F0","#84D8FF","#FFC800"],22); sfx.win(); confetti(); },900);
}

/* ------------------------------------------------------------------ badges / shop / me */
let armFilter="הכל";

const ARM_GROUPS=[["הכל",()=>true],["רובים",w=>/^רובה|קרבין/.test(w.type)],["אקדחים",w=>/^אקדח/.test(w.type)],["תת-מקלעים",w=>/תת-מקלע|הגנה אישי/.test(w.type)],["מקלעים",w=>/^מקלע/.test(w.type)],["שולט בחלקים",w=>(S.wdPerfect||[]).includes(w.id)]];
let armQuery="";
function renderArmory(){
  if(!ARM_GROUPS.some(g=>g[0]===armFilter)) armFilter="הכל";
  const inGroup=ARM_GROUPS.find(g=>g[0]===armFilter)[1];
  const list=WEAPONS.filter(inGroup);
  $("#main").innerHTML=`<h1 class="page-title">נשקייה</h1><p class="page-sub">${WEAPONS.length} כלי נשק: נתונים, חלקים ועובדות. לחץ על כרטיס לפרטים.</p>

   <div class="arm-search">${ico("i-search")}<input id="armQ" type="search" placeholder="חפש נשק, מדינה, קליבר או חלק" value="${esc(armQuery)}" autocomplete="off"></div>
   <div class="chips">${ARM_GROUPS.filter(([t,f])=>t==="הכל"||t===armFilter||WEAPONS.some(f)).map(([t,f])=>`<button class="chip" aria-pressed="${t===armFilter}" data-f="${esc(t)}">${esc(t)} <span class="chip-n">${WEAPONS.filter(f).length}</span></button>`).join("")}</div>
   <details class="arm-prac" id="armPrac" ${pracOpen()?"open":""}><summary>${ico("i-dumbbell")}<b>תרגולים</b><small>כרטיסיות, לפי תקופה ולפי מדינה</small></summary>
   <button class="btn wide teal fc-go" id="fcGo">${ico("i-book")}כרטיסיות: חזרה מהירה על ${heN(Math.min(10,list.length),"נשק אחד","נשקים")}</button>
   ${armFilter==="הכל"?countryRow():""}</details>
   <p class="arm-empty" id="armEmpty" hidden>לא נמצא נשק כזה. נסה מילה אחרת.</p>
   <div class="arm-grid">${list.map((w,i)=>`<button class="arm-card" style="--d:${Math.min(i,12)}" data-w="${w.id}" data-q="${esc((w.n+" "+w.id+" "+w.country+" "+w.cal+" "+w.type+" "+Object.values(PARTS[w.sil]||{}).map(x=>x[0]).join(" ")).toLowerCase())}"><div class="sil-box">${silSvg(w)}${w.gen?`<span class="gen">איור כללי</span>`:""}</div>
     ${(S.seen||[]).includes(w.id)?`<span class="arm-got">${ico("i-check")}</span>`:`<span class="arm-new">חדש</span>`}${(S.wdPerfect||[]).includes(w.id)?`<span class="arm-star" title="תרגלת את כל החלקים בלי טעויות" aria-label="תרגלת את כל החלקים בלי טעויות">${ico("i-star")}</span>`:""}<div class="arm-meta"><b>${esc(w.n)}</b><small>${esc(w.type)} · ${esc(w.country)} · ${esc(w.year)}</small><span class="cal">${esc(w.cal)}</span></div></button>`).join("")}</div>`;

/* the armory practice panel is open until the viewer closes it once (a per-device convenience) */
function pracOpen(){ try{ return localStorage.getItem("arsenal-prac")!=="0"; }catch(e){ return true; } }
/* ---- practice by country: identify the weapons of one country, plus a few of their parts */
function countryList(){ return Object.keys(FLAGS).map(c=>[c,WEAPONS.filter(w=>!w.gen&&w.country===c)]).filter(([,ws])=>ws.length>=3).sort((a,b)=>b[1].length-a[1].length); }
const ERAS=[["עד 1945",0,1945],["1946 עד 1979",1946,1979],["1980 עד 1999",1980,1999],["מ-2000",2000,9999]];
const eraOf=w=>{const y=+w.year; return ERAS.findIndex(e=>y>=e[1]&&y<=e[2]);};
function startEraDrill(i){
  const ws=shuffle(WEAPONS.filter(w=>!w.gen&&eraOf(w)===i)), qs=ws.slice(0,7).map(w=>({t:"id",w:w.id}));
  qs.push({t:"rank",k:"year"}); ws.filter(w=>PARTS[w.sil]).slice(0,2).forEach(w=>qs.push({t:"part",w:w.id}));
  startLesson({u:COURSE[0],ui:0,n:{t:"practice",name:`נשקים מהתקופה ${ERAS[i][0]}`},key:"practice"},shuffle(qs));
}
function countryRow(){
  const cs=countryList(); if(!cs.length) return "";
  const eras=ERAS.map((e,i)=>[e[0],WEAPONS.filter(w=>!w.gen&&eraOf(w)===i).length,i]).filter(e=>e[1]>=4);
  return `<div class="cty-wrap"><b>תרגול לפי תקופה</b><div class="cty-row era-row">${eras.map(([t,n,i])=>`<button class="cty era" data-era="${i}" aria-label="תרגול נשקים מהתקופה ${esc(t)}"><b>${esc(t)}</b><span>${n}</span></button>`).join("")}</div><b>תרגול לפי מדינה</b><div class="cty-row">${cs.map(([c,ws])=>`<button class="cty ${(S.ctyPerfect||[]).includes(c)?"done":""}" data-c="${esc(c)}" aria-label="תרגול הנשקים של ${esc(c)}${(S.ctyPerfect||[]).includes(c)?", הושלם בלי טעויות":""}">${flagSvg(c)}<small>${esc(c)}</small><span>${(S.ctyPerfect||[]).includes(c)?"★":ws.length}</span></button>`).join("")}</div></div>`;
}
function startCountryDrill(c){
  const ws=shuffle(WEAPONS.filter(w=>!w.gen&&w.country===c)), qs=ws.slice(0,7).map(w=>({t:"id",w:w.id}));
  ws.filter(w=>PARTS[w.sil]).slice(0,3).forEach(w=>qs.push({t:"part",w:w.id}));
  startLesson({u:COURSE[0],ui:0,n:{t:"practice",name:`הנשקים של ${c}`},key:"practice",cty:c},shuffle(qs));
}
/* ---- flashcards: drawing on the front, the key facts on the back; "knew it" / "not yet" */
function flashcards(list){
  const deck=shuffle(list.filter(w=>!w.gen)).slice(0,10), miss=[]; let i=0, known=0;
  const show=()=>{
    if(i>=deck.length){
      if(deck.length>=10&&known>(S.fcBest||0)){ const before=BADGES.filter(earned).length; S.fcBest=known; save(); if(BADGES.filter(earned).length>before) setTimeout(()=>toast("עיטור חדש: שולט בכרטיסיות!"),600); }
      sheet(`<div class="center">${mascot(known===deck.length?"happy":"neutral","fc-kd")}<h2>${known===deck.length?"הכרת את כולם!":"סיימת את הכרטיסיות"}</h2>
        <p class="page-sub" style="margin:0">הכרת <b>${known}</b> מתוך <b>${deck.length}</b> נשקים.</p>
        ${miss.length?`<div class="st-ws" style="justify-content:center;margin-top:12px">${miss.map(w=>`<span class="fc-miss">${esc(w.n)}</span>`).join("")}</div>`:""}
        ${miss.length?`<button class="btn wide teal" id="fcAgain">חזור על אלה שלא ידעת</button>`:""}<button class="btn wide ghost" id="sx">סגור</button></div>`);
      if(known===deck.length){ sfx.win(); confetti(); }
      const ag=$("#fcAgain"); if(ag) ag.onclick=()=>flashcards(miss);
      $("#sx").onclick=closeSheet; return;
    }
    const w=deck[i];
    sheet(`<div class="fc-top" role="status"><span dir="ltr" aria-label="כרטיס ${i+1} מתוך ${deck.length}">${i+1} / ${deck.length}</span><div class="pbar"><i style="width:${i/deck.length*100}%"></i></div></div>
      <button class="fc" id="fcCard" aria-label="הפוך כרטיס"><div class="fc-in">
        <div class="fc-face fc-front" id="fcF"><div class="sil-box">${silSvg(w)}</div><b>מה שם הנשק?</b><small>הקש כדי להפוך</small></div>
        <div class="fc-face fc-back" id="fcB" aria-hidden="true"><b class="fc-n">${esc(w.n)}</b><small>${esc(w.type)} · ${esc(w.country)} · ${esc(w.year)}</small>
          <div class="fc-rows"><span>תחמושת</span><b>${esc(w.cal)}</b><span>מחסנית</span><b>${esc(w.mag)}</b><span>מנגנון</span><b>${esc(w.act)}</b></div></div></div></button>
      <div class="fc-btns" id="fcBtns" hidden><button class="btn red" id="fcNo">עוד לא</button><button class="btn" id="fcYes">ידעתי</button></div>
      <button class="btn wide ghost" id="sx">יציאה</button>`);
    const flip=()=>{ const c=$("#fcCard"); if(!c||c.classList.contains("on")) return; c.classList.add("on"); sfx.tap(); $("#fcBtns").hidden=false;
      $("#fcF").setAttribute("aria-hidden","true"); $("#fcB").removeAttribute("aria-hidden"); c.setAttribute("aria-label",`${w.n}. ${w.type}, ${w.country}, ${w.year}`);
      if(!(S.seen||[]).includes(w.id)){ S.seen=[...(S.seen||[]),w.id]; save(); } };
    const ans=ok=>{ if(ok){known++;sfx.ok&&sfx.ok();} else miss.push(w); i++; show(); };
    $("#fcCard").onclick=flip; $("#fcYes").onclick=()=>ans(true); $("#fcNo").onclick=()=>ans(false); $("#sx").onclick=closeSheet;
    $("#overlay").onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){ if(!$("#fcCard").classList.contains("on")){e.preventDefault();flip();} } else if($("#fcCard").classList.contains("on")&&(e.key==="1"||e.key==="2")){ e.preventDefault(); ans(e.key==="2"); } };
    $("#fcCard").focus();
  };
  show();
}
function weaponSheet(w){
  S.seen=S.seen||[]; if(!S.seen.includes(w.id)){S.seen.push(w.id);save();}

/* ---- one-weapon parts drill: every part once, a label round, and missing-part questions */
function startWeaponDrill(w){
  const P=PARTS[w.sil], keys=Object.keys(P), qs=[{t:"id",w:w.id}];
  shuffle(keys).slice(0,5).forEach(k=>qs.push({t:"part",w:w.id,p:k}));
  if(keys.length>=3) qs.push({t:"label",w:w.id,n:Math.min(4,keys.length)});
  if(keys.length>=4) shuffle(keys.filter(k=>missClean(P,k))).slice(0,2).forEach(k=>qs.push({t:"miss",w:w.id,p:k}));
  startLesson({u:COURSE[0],ui:0,n:{t:"practice",name:`החלקים של ${w.n}`},key:"practice",wd:w.id},qs);
}

function compareSheet(a,b){

  /* numeric rows get a winner mark: longer range, bigger magazine, lighter weight, older year */
  const win={rng:"hi",mag:"hi",kg:"lo",year:"lo"};
  const mark=(k,side)=>{ if(!win[k]) return ""; const va=k==="mag"&&/חגור/.test(a.mag)?null:specNum(a[k]), vb=k==="mag"&&/חגור/.test(b.mag)?null:specNum(b[k]);

  const label={rng:"טווח ארוך יותר",mag:"יותר כדורים",kg:"קל יותר",year:"ותיק יותר"};
  sheet(`<h2 class="cmp-title">${esc(a.n)} <span>מול</span> ${esc(b.n)}</h2>

let L=null;
function startLesson(f,custom){
  const u=f.u, all=u.lessons.flatMap(l=>l.qs), st=stageOf(f), full=isFull(f);
  let qs, timed=false;
  if(custom) qs=custom;
  else if(f.n.t==="lesson"){
    const own=u.lessons[f.n.li].qs, stage=full?0:st;
    if(stage===1){ const extra=shuffle(all.filter(q=>!own.includes(q)&&q.t!=="match")).slice(0,2); qs=shuffle([...own,...extra]); }
    else qs=shuffle(own);
    timed=stage===2;
  } else qs=f.n.t==="review"?shuffle(all).slice(0,6):shuffle(all).slice(0,15);
  if(!f.blitz) qs=toBuild(qs);
  L={practice:f.n.t==="practice",f,qs,i:0,first:0,firstTotal:qs.length,mistakes:[],state:"answer",sel:null,combo:0,t0:Date.now(),timed,stage:full?-1:st,pct:0,xpRun:0};
  $("#lesson").hidden=false; document.body.style.overflow="hidden";
  if(S.hearts<=0&&!(L&&L.practice)) return noHearts();
  const teach=!custom&&f.n.t==="lesson"?teachCards(u.lessons[f.n.li].qs,u.id+":"+f.n.li):[];
  L.teach=teach;
  const myL=L; /* a splash from a lesson that was already left must not start the next one */
  $("#lesson").innerHTML=""; splash(()=>{ if(!L||L!==myL||L.state!=="answer") return; if(teach.length&&!full&&st===0) startTeach(); else renderQ(); });
}
function splash(cb){

  const title=f.n.t==="practice"?f.n.name:isLes?(st<0?"תרגול":`שלב ${st+1}`):f.n.name;
  const sub=isLes?(st<0?esc(f.n.name):`${esc(f.n.name)} · ${STAGE_NAME[st]}`):esc(f.u.title);
  const d=document.createElement("div"); d.className="splash"; d.style.cssText=uv(f.u);
  const nq=L.qs.length, mins=Math.max(1,Math.round(nq*12/60)), meta=f.blitz?"":`<small class="sp-n">${heN(nq,"שאלה אחת","שאלות")} · כ-${mins} ${mins===1?"דקה":"דקות"}</small>`;
  d.innerHTML=`${mascot("happy","jump")}<h2>${title}</h2><p>${sub}</p>${meta}${isLes&&st>=0?`<div class="pips">${[0,1,2].map(k=>`<i class="${k<st?"on":k===st?"now":""}" style="--d:${k}">${k<st?`<svg viewBox="0 0 24 24"><use href="#i-check"/></svg>`:""}</i>`).join("")}</div>`:""}`;

  if(L.i>=L.firstTotal) return `<div class="l-kicker" style="color:var(--red-ink)">טעות קודמת, ננסה שוב</div>`;
  if(L.timed) return `<div class="l-kicker legend">${ico("i-bolt")}שלב אגדי · ${T_SEC} שניות לשאלה</div>`;
  if(L.stage===1) return `<div class="l-kicker">שלב מתקדם</div>`;
  const cnt=`שאלה ${Math.min(L.i+1,L.firstTotal)} מתוך ${L.firstTotal}`;
  return `<div class="l-kicker count">${KIND[L.f.n.t]?KIND[L.f.n.t]+" · ":""}${cnt}</div>`;
}

function onGo(){ if(L&&L.state==="moving") return; if(L&&L.state==="teach") return teachNext(); if(L&&L.state==="answer"&&L.qs[L.i].t==="story"&&!L.storyDone) return storyNext(); if(L.state==="answer"){ const t=L.qs[L.i].t; return t==="build"?checkBuild():t==="part"?checkPart():t==="order"||t==="rank"?checkOrder():t==="label"?checkLabel():t==="type"?checkType():check(); } if(L.state==="checked")return advance(); if(L.state==="screens")return nextScreen(); closeLesson(); }

function timeUp(){

function advance(){

  if(L.practice&&L.f.wd&&L.first===L.firstTotal){ S.wdPerfect=[...new Set([...(S.wdPerfect||[]),L.f.wd])]; }

/* ---- hearts refill over time: one heart every 4 hours */
const HEART_MS=4*36e5;
function regenHearts(){
  if(S.hearts>=5){S.hRef=null;return;}
  if(!S.hRef) S.hRef=Date.now();
  while(S.hearts<5&&Date.now()-S.hRef>=HEART_MS){S.hearts++;S.hRef+=HEART_MS;}
  if(S.hearts>=5)S.hRef=null;
  save();
}
const fmtT=ms=>{ms=Math.max(0,ms);const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;};
let heartTick=null;
function heartsSheet(){

    <p class="page-sub" style="margin:0" id="hTimer">${S.hearts>=5?"הלבבות מלאים. אפשר ללמוד!":`הלב הבא בעוד <b>${fmtT(HEART_MS-(Date.now()-S.hRef))}</b>`}</p>
    <div class="list" style="width:100%;text-align:start">
     <div class="li"><div class="ic" style="--c:var(--soft);width:56px;height:56px"><svg viewBox="0 0 24 24" style="color:var(--heart)"><use href="#i-heart"/></svg></div><div class="t"><b>מילוי מלא</b><small style="margin:0">חזרה ל-5 לבבות</small></div>
       <button class="btn ghost" id="hBuy" ${S.hearts<5&&S.gems>=25?"":"disabled"}>${ico("i-gem")}<span style="color:var(--gem)">25</span></button></div>
     <div class="li"><div class="ic" style="--c:var(--soft);width:56px;height:56px"><svg viewBox="0 0 24 24" style="fill:var(--green)"><use href="#i-dumbbell"/></svg></div><div class="t"><b>תרגול כדי להרוויח לב</b><small style="margin:0">5 שאלות ממה שכבר למדת. אין בו פסילות.</small></div>
       <button class="btn" id="hPrac" ${S.hearts<5&&canPractice?"":"disabled"}>תרגול</button></div>
    </div><button class="btn wide ghost" id="sx">סגור</button></div>`);
  $("#sx").onclick=()=>{clearInterval(heartTick);closeSheet();};

  clearInterval(heartTick); heartTick=setInterval(()=>{const t=$("#hTimer"); if(!t){clearInterval(heartTick);return;} regenHearts(); if(S.hearts<5)t.innerHTML=`הלב הבא בעוד <b>${fmtT(HEART_MS-(Date.now()-S.hRef))}</b>`;},1000);
}

/* ---- weekly league (computer opponents) */
const TIERS=[["ארד","#CD7F32"],["כסף","#9AA7B4"],["זהב","#FFC800"],["פלטינה","#4FC7D8"],["יהלום","#7C8CF8"]];
const BOTS=["נץ","עקרב","ברק","זאב","סער","רעם","נמר","חוד","צפע"];
const weekStart=(d=new Date())=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x;};
const wkKey=d=>d.toISOString().slice(0,10);
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function myWeekXP(ws){let t=0;for(let i=0;i<7;i++){const d=new Date(ws.getTime()+i*864e5);t+=S.days[d.toISOString().slice(0,10)]||0;}return t;}
function standings(ws,full){
  const k=wkKey(ws), el=full?7:Math.min(7,(Date.now()-ws)/864e5), tier=(S.league&&S.league.tier)||0;
  const bots=BOTS.map(n=>{const h=hash(k+n), rate=(8+h%40)*(1+tier*.35), lazy=h%7===0; return {n,bot:1,xp:lazy?Math.round(rate*.3*el):Math.round(rate*el*(.6+(h>>5)%50/100))};});
  return [...bots,{n:"אתה",me:1,xp:myWeekXP(ws)}].sort((a,b)=>b.xp-a.xp||(a.me?-1:1));
}
function leagueTick(){
  const ws=weekStart(), k=wkKey(ws);
  if(!S.league){S.league={tier:0,week:k,result:null};return save();}
  if(S.league.week!==k){
    const prev=new Date(S.league.week), played=myWeekXP(prev)>0;
    if(played){ const rk=standings(prev,true).findIndex(r=>r.me)+1;
      if(rk<=3&&S.league.tier<TIERS.length-1){S.league.tier++;S.league.result="up";}
      else if(rk>=9&&S.league.tier>0){S.league.tier--;S.league.result="down";} else S.league.result="stay"; }
    S.league.week=k; save();
  }
}
function leagueCard(){ const rows=standings(weekStart()), me=rows.findIndex(r=>r.me)+1, T=TIERS[S.league.tier];
  return `<div class="card"><h3>ליגת ${T[0]} <button data-go="league">הצג ליגה</button></h3><div class="rank-row"><svg class="shield sm" viewBox="0 0 24 24" style="--sc:${T[1]}"><use href="#i-shield"/></svg>
   <div><b style="font-size:18px;color:var(--ink-strong)">אתה במקום ${me}</b><p>${me<=3?"אתה באזור העלייה!":"3 הראשונים עולים לליגה הבאה"}</p></div></div></div>`; }
function renderLeague(){

  const res=S.league.result; S.league.result=null; save();

    <p class="page-sub" style="text-align:center">3 הראשונים עולים לליגה הבאה · נשארו ${left} ${left===1?"יום":"ימים"}</p></div>
    ${res==="up"?`<div class="league-msg up">עלית לליגת ${T[0]}! ${ico("i-star")}</div>`:res==="down"?`<div class="league-msg down">ירדת לליגת ${T[0]}. השבוע מתקנים.</div>`:""}
    <div class="board">${rows.map((r,i)=>`${i===3?`<div class="zone up">${ico("i-star")}אזור עלייה</div>`:""}${i===rows.length-2&&S.league.tier>0?`<div class="zone down">אזור ירידה</div>`:""}
      <div class="row ${r.me?"me":""}" style="--d:${i}"><span class="pos ${i<3?"p"+(i+1):""}">${i+1}</span>
      <span class="av" style="background:${r.me?"var(--green)":`hsl(${hash(r.n)%360} 60% 55%)`}">${r.me?`<svg viewBox="0 0 120 120"><use href="#kasdi"/></svg>`:esc(r.n[0])}</span>
      <span class="nm">${esc(r.n)}${r.bot?`<small>יריב ממוחשב</small>`:""}</span><span class="pts">${r.xp} XP</span></div>`).join("")}</div>

/* ---- word-tile questions (built from multiple-choice answers) */
const words=s=>String(s).split(/\s+/).filter(Boolean);
const buildable=q=>q.t==="mc"&&words(q.a[q.c]).length>=3&&words(q.a[q.c]).length<=8;
function toBuild(qs){ return qs.map(q=>buildable(q)&&Math.random()<.45?{t:"build",base:q}:q); }
function renderBuild(q,kick,tm,bubble){
  const ans=words(q.base.a[q.base.c]);
  const extra=[...new Set(q.base.a.filter((_,i)=>i!==q.base.c).flatMap(words))].filter(w=>!ans.includes(w));
  L.tiles=shuffle([...ans,...shuffle(extra).slice(0,Math.min(3,extra.length))]); L.build=[];
  frame(`${kick}<h1 class="l-title">בנה את התשובה</h1>${bubble(q.base.q)}
    <div class="build-line" id="bl"></div><div class="bank" id="bank">${L.tiles.map((t,i)=>`<button class="tile" style="--d:${i}" data-t="${i}">${esc(t)}</button>`).join("")}</div>`,"בדיקה",true,"",tm);
  const sync=()=>{ $("#bl").innerHTML=L.build.map(i=>`<button class="tile in" data-b="${i}">${esc(L.tiles[i])}</button>`).join("");
    $$("#bank .tile").forEach(b=>b.classList.toggle("used",L.build.includes(+b.dataset.t))); $("#go").disabled=!L.build.length;
    $$("#bl .tile").forEach(b=>b.onclick=()=>{ if(L.state!=="answer")return; L.build=L.build.filter(x=>x!==+b.dataset.b); sfx.tap(); sync(); }); };
  $$("#bank .tile").forEach(b=>b.onclick=()=>{ if(L.state!=="answer"||L.build.includes(+b.dataset.t))return; L.build.push(+b.dataset.t); sfx.pop(); sync(); });
}

  const q=L.qs[L.i].base, ok=!timeout&&L.build.map(i=>L.tiles[i]).join(" ")===words(q.a[q.c]).join(" ");

  L.state="checked"; feedback(ok,(timeout?"נגמר הזמן. ":"")+(q.e||""),q);

/* ---- mistakes bank */
const QREF=new Map(), QBYREF={};
COURSE.forEach((u,ui)=>u.lessons.forEach((l,li)=>l.qs.forEach((q,qi)=>{const r=`${u.id}.${li}.${qi}`;QREF.set(q,r);QBYREF[r]=q;})));
/* spaced repetition: a missed question comes back today, then after 1, 3 and 7 days, until it is answered right in review each time */
const SRS_DAYS=[1,3,7];
const addDays=(d,n)=>{const t=new Date(d);t.setDate(t.getDate()+n);return t.toISOString().slice(0,10);};
function missDue(){ S.srs=S.srs||{}; return (S.miss||[]).filter(r=>QBYREF[r]&&(!S.srs[r]||S.srs[r].d<=today())); }
function missNext(){ S.srs=S.srs||{}; const ds=(S.miss||[]).filter(r=>QBYREF[r]&&S.srs[r]&&S.srs[r].d>today()).map(r=>S.srs[r].d).sort(); return ds[0]||null; }
function noteAnswer(q0,ok,clear){
  const base=q0&&q0.t==="build"?q0.base:q0, r=QREF.get(base); if(!r) return;
  S.miss=(S.miss||[]).filter(x=>QBYREF[x]); S.srs=S.srs||{};
  const drop=()=>{ S.miss=S.miss.filter(x=>x!==r); delete S.srs[r]; };
  if(!ok){ if(!S.miss.includes(r)){ S.miss.push(r); if(S.miss.length>40){ delete S.srs[S.miss.shift()]; } } S.srs[r]={b:0,d:today()}; return; }
  if(!clear||!S.miss.includes(r)) return;
  if(L&&L.f&&L.f.mist){ const e=S.srs[r]||{b:0}; e.b++; if(e.b>SRS_DAYS.length){ drop(); S.srsDone=(S.srsDone||0)+1; } else { e.d=addDays(today(),SRS_DAYS[e.b-1]); S.srs[r]=e; } }
  else drop();
}
function startMistakes(){
  const qs=missDue().map(r=>QBYREF[r]).filter(Boolean); if(!qs.length) return;
  startLesson({u:COURSE[0],ui:0,n:{t:"practice",name:"תרגול טעויות"},key:"practice",mist:1},shuffle(qs).slice(0,8));
}
function mistakesCard(){
  const n=missDue().length, nx=missNext();
  if(!n&&!nx) return "";
  if(!n){ const days=Math.max(1,Math.round((new Date(nx)-new Date(today()))/864e5));
    return `<div class="miss-card done"><svg viewBox="0 0 24 24"><use href="#i-check"/></svg><div class="t"><b>חזרה מרווחת</b><p>סיימת את החזרות להיום. החזרה הבאה ${days===1?"מחר":`בעוד ${days} ימים`}.</p></div></div>`; }
  return `<div class="miss-card"><svg viewBox="0 0 24 24"><use href="#i-dumbbell"/></svg><div class="t"><b>חזרה מרווחת</b><p>${n===1?"שאלה אחת":n+" שאלות"} לחזור עליהן היום. כל שאלה חוזרת אחרי יום, 3 ימים ושבוע.</p></div><button class="btn" id="missGo">תרגל</button></div>`;
}

/* ---- "tap the part" questions */
function renderPart(q,kick,tm){
  const w=WMAP[q.w], parts=PARTS[w.sil], keys=Object.keys(parts);

  const hs=keys.map((k,i)=>{const [,x,y,ww,hh]=parts[k];return `<rect class="hot" data-p="${k}" x="${x}" y="${y}" width="${ww}" height="${hh}" rx="6" tabindex="0" role="button" aria-label="אזור ${i+1} בציור"/>`;}).join("");
  frame(`${kick}<h1 class="l-title">גע ב${esc(parts[L.part][0].replace(/^ה/,""))}</h1><p class="part-sub">${esc(w.n)} · לחץ על החלק הנכון בציור</p>
    <div class="id-card part-card"><svg class="sil gun part-svg" viewBox="0 0 240 96"><ellipse class="gsh" cx="120" cy="90" rx="100" ry="4"/>${SIL[w.sil]}<g id="hots">${hs}</g><g id="plabel"></g></svg></div>`,"בדיקה",true,"",tm);
  $$(".hot").forEach(r=>{ r.addEventListener("click",()=>{ if(L.state!=="answer")return; $$(".hot").forEach(x=>x.classList.remove("sel")); r.classList.add("sel"); L.psel=r.dataset.p; $("#go").disabled=false; sfx.tap(); });
    r.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); e.stopPropagation(); r.dispatchEvent(new MouseEvent("click",{bubbles:true})); } }); });
}
function checkPart(timeout){
  const w=WMAP[L.qs[L.i].w], parts=PARTS[w.sil], ok=!timeout&&L.psel===L.part;
  $$(".hot").forEach(r=>{ r.classList.remove("sel"); if(r.dataset.p===L.part) r.classList.add("good"); else if(r.dataset.p===L.psel) r.classList.add("bad"); });
  const [name,x,y,ww,hh]=parts[L.part], ly=y<20?y+hh+12:y-6;

/* ---- fill the gap: the chosen word flies into the sentence */
function renderGap(q,kick,tm){
  const [a,b]=q.s.split("___"); L.order=shuffle(q.a.map((_,i)=>i));
  frame(`${kick}<h1 class="l-title">השלם את המשפט</h1><div class="gap-card">${mascot("neutral","gap-kd")}<p class="gap-s">${spk(q.s.replace("___","..."))}${esc(a)}<span class="gap" id="gap"></span>${esc(b||"")}</p></div>

  bindChoice();
  L.onSel=btn=>{ const g=$("#gap"), r1=btn.getBoundingClientRect(), r2=g.getBoundingClientRect(), txt=btn.textContent;
    if(RM()){ g.textContent=txt; g.classList.add("filled"); return; }
    const f=document.createElement("span"); f.className="chip-fly"; f.textContent=txt; f.style.cssText=`left:${r1.left}px;top:${r1.top}px;width:${r1.width}px;height:${r1.height}px`; document.body.appendChild(f);
    g.classList.remove("filled"); g.textContent="";
    f.animate([{transform:"translate(0,0) scale(1)"},{transform:`translate(${r2.left+r2.width/2-(r1.left+r1.width/2)}px,${r2.top+r2.height/2-(r1.top+r1.height/2)}px) scale(.9)`}],{duration:320,easing:"cubic-bezier(.3,1.2,.5,1)"}).onfinish=()=>{ f.remove(); if(L&&L.state==="answer"){ g.textContent=txt; g.classList.add("filled"); } };

/* ---- milestone toasts inside a lesson */
function milestone(){
  if(!L||L.i>=L.firstTotal) return;
  let msg=null;
  if(L.i===Math.floor(L.firstTotal/2)&&!L.halfShown&&L.firstTotal>=4){ L.halfShown=1; msg=["חצי דרך! ממשיכים","i-star"]; }
  else if(L.combo===5&&!L.c5){ L.c5=1; msg=["5 תשובות ברצף!","i-fire"]; }
  if(!msg) return;
  setTimeout(()=>{ if(!L) return; const t=document.createElement("div"); t.className="toast"; t.innerHTML=`${mascot("happy","toast-kd")}<b>${msg[0]}</b><svg viewBox="0 0 24 24" class="ti"><use href="#${msg[1]}"/></svg>`;
    $("#lesson").appendChild(t); sfx.streak(); setTimeout(()=>t.remove(),2200); },120);
}
