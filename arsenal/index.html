<title>ארסנל</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Layout: phone-first game shell. Sticky stat bar on top, scrolling path of chunky 3D lesson nodes grouped by colored unit bands, fixed tab bar at the bottom; lessons open as a full-screen sheet. Each unit owns a hue (--u / --u-d). */
:root{
  --bg:#F4F6EF; --surface:#FFFFFF; --surface-2:#EEF1E7; --ink:#1F2619; --muted:#6A735E; --line:#DDE2D3; --line-d:#C7CDBC;
  --brass:#F0A81C; --brass-d:#C98410;
  --good:#3BA84A; --good-d:#2A8237; --good-bg:#E3F5DF;
  --bad:#E0483B;  --bad-d:#B3352A;  --bad-bg:#FDE5E1;
  --locked:#E2E5DB; --locked-d:#C9CDBF; --locked-i:#A9AF9D;
  --font:"Rubik","Assistant",system-ui,-apple-system,"Arial Hebrew",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11150E; --surface:#1A2015; --surface-2:#222A1C; --ink:#EEF2E6; --muted:#9BA58E; --line:#2D3626; --line-d:#232A1D;
  --good-bg:#183020; --bad-bg:#3A1A17; --locked:#283022; --locked-d:#1C2218; --locked-i:#56604B; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11150E; --surface:#1A2015; --surface-2:#222A1C; --ink:#EEF2E6; --muted:#9BA58E; --line:#2D3626; --line-d:#232A1D;
  --good-bg:#183020; --bad-bg:#3A1A17; --locked:#283022; --locked-d:#1C2218; --locked-i:#56604B; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;direction:rtl;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;padding-block:10px}
.brand{font-weight:900;font-size:24px;letter-spacing:-.5px;margin-inline-end:auto;display:flex;align-items:center;gap:6px;color:var(--ink)}
.brand svg{width:34px;height:34px}
.pill{display:flex;align-items:center;gap:5px;font-weight:800;font-family:var(--mono);font-size:16px;padding:6px 10px;border-radius:12px;background:var(--surface-2)}
.pill svg{width:22px;height:22px}
.pill.streak{color:#F07A1C}.pill.xp{color:var(--brass)}.pill.hearts{color:var(--bad)}
.pill.streak.off{color:var(--locked-i)}

/* ---------- views */
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.view-title{font-weight:900;font-size:28px;margin:24px 0 4px}
.view-sub{color:var(--muted);margin:0 0 18px;font-weight:500}

/* daily card */
.daily{display:flex;align-items:center;gap:14px;margin-top:18px;padding:14px 16px;border:2px solid var(--line);border-radius:20px;background:var(--surface)}
.daily .chest{flex:none;width:52px;height:52px}
.daily .txt{flex:1;min-width:0}
.daily b{display:block;font-weight:800}
.bar{height:16px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px;position:relative}
.bar>i{display:block;height:100%;background:var(--brass);border-radius:99px;transition:width .5s cubic-bezier(.2,.9,.3,1.2);box-shadow:inset 0 -4px 0 rgb(0 0 0 / .12)}
.bar>i::after{content:"";position:absolute;inset:3px 8px auto;height:4px;border-radius:9px;background:rgb(255 255 255 / .35)}
.bar>i{position:relative}

/* unit band */
.unit{margin-top:28px}
.band{position:relative;overflow:hidden;border-radius:20px;padding:16px 18px;color:#fff;background:var(--u);box-shadow:0 5px 0 var(--u-d);display:flex;align-items:center;gap:14px}
.band::before{content:"";position:absolute;inset:0;opacity:.18;pointer-events:none;
  background:radial-gradient(28px 18px at 12% 30%,#000 98%,#0000),radial-gradient(34px 22px at 40% 80%,#000 98%,#0000),radial-gradient(24px 30px at 70% 20%,#fff 98%,#0000),radial-gradient(40px 20px at 88% 70%,#000 98%,#0000),radial-gradient(20px 16px at 55% 45%,#fff 98%,#0000);background-size:180px 90px}
.band .txt{position:relative;flex:1;min-width:0}
.band .eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em;opacity:.85}
.band h2{margin:0;font-weight:900;font-size:22px;line-height:1.2}
.band p{margin:2px 0 0;font-size:15px;opacity:.92;font-weight:500}
.band .emb{position:relative;flex:none;width:56px;height:56px;border-radius:16px;background:rgb(255 255 255 / .18);display:grid;place-items:center}
.band .emb svg{width:34px;height:34px;fill:#fff}
.band .uprog{position:relative;font-family:var(--mono);font-size:13px;background:rgb(0 0 0 / .18);border-radius:8px;padding:2px 8px;display:inline-block;margin-top:6px}

.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:30px 8px}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.ring{position:absolute;top:-9px;width:98px;height:98px;pointer-events:none}
.node{position:relative;width:80px;height:72px;border:none;border-radius:50%;background:var(--u);box-shadow:0 8px 0 var(--u-d);display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.node::before{content:"";position:absolute;inset:8px 14px auto;height:12px;border-radius:50%;background:rgb(255 255 255 / .28)}
.node:active{transform:translateY(6px);box-shadow:0 2px 0 var(--u-d)}
.node svg{width:36px;height:36px;fill:#fff;position:relative}
.node.done{background:var(--brass);box-shadow:0 8px 0 var(--brass-d)}
.node.locked{background:var(--locked);box-shadow:0 8px 0 var(--locked-d);cursor:not-allowed}
.node.locked svg{fill:var(--locked-i)}
.tip{position:absolute;top:-48px;white-space:nowrap;background:var(--surface);color:var(--u);border:2px solid var(--line);font-weight:900;font-size:15px;padding:5px 14px;border-radius:12px;animation:bob 1.4s ease-in-out infinite;z-index:1}
.tip::after{content:"";position:absolute;bottom:-8px;left:50%;width:12px;height:12px;background:var(--surface);border:2px solid var(--line);border-top:none;border-left:none;transform:translateX(-50%) rotate(45deg)}
.crown{position:absolute;bottom:-4px;inset-inline-start:-6px;background:var(--surface);border:2px solid var(--brass);border-radius:99px;font-size:12px;font-weight:800;padding:0 7px;color:var(--brass-d);font-family:var(--mono)}
.node-label{font-size:14px;color:var(--muted);font-weight:700;margin-top:2px}
.buddy{position:absolute;top:50%;width:96px;height:96px;transform:translateY(-50%);opacity:.95}
@keyframes bob{50%{transform:translateY(-5px)}}

/* tab bar */
.tabs{position:fixed;inset:auto 0 0;z-index:6;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-block:8px}
.tab{border:2px solid transparent;background:none;border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:800;color:var(--muted)}
.tab svg{width:28px;height:28px;fill:currentColor}
.tab[aria-current="page"]{color:#2F6FD6;border-color:#9DBDF2;background:color-mix(in srgb,#2F6FD6 10%,var(--surface))}

/* achievements & profile */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{border:2px solid var(--line);border-radius:20px;background:var(--surface);padding:16px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 0 var(--line)}
.badge .medal{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--c);box-shadow:inset 0 -6px 0 rgb(0 0 0 / .18),0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
.badge .medal svg{width:32px;height:32px;fill:#fff}
.badge.off .medal{background:var(--locked);box-shadow:none}.badge.off .medal svg{fill:var(--locked-i)}
.badge b{font-weight:800}.badge small{color:var(--muted);font-weight:500;font-size:13px;line-height:1.3}
.badge .prog{font-family:var(--mono);font-size:12px;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.st{border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:10px;align-items:center;background:var(--surface)}
.st svg{width:30px;height:30px;flex:none}
.st b{display:block;font-family:var(--mono);font-size:22px;line-height:1}
.st small{color:var(--muted);font-weight:700}
.btn-ghost{margin-top:20px;width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;font-weight:800;color:var(--bad);box-shadow:0 4px 0 var(--line)}
.btn-ghost.seg{color:var(--ink)}
.seg-row{display:flex;gap:8px;margin-top:12px}
.seg-row button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.seg-row button[aria-pressed="true"]{border-color:#2F6FD6;color:#2F6FD6;box-shadow:0 3px 0 #9DBDF2}
.prof-head{display:flex;align-items:center;gap:16px;margin-top:22px}
.avatar{width:88px;height:88px;border-radius:50%;background:var(--surface-2);border:3px dashed var(--line-d);display:grid;place-items:center}
.avatar svg{width:70px;height:70px}
.rank{display:inline-block;margin-top:4px;font-weight:800;font-size:14px;color:#fff;background:#6E8B2E;padding:2px 10px;border-radius:8px}

/* ---------- lesson sheet */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lesson-top{display:flex;align-items:center;gap:14px;padding-block:16px}
.x{background:none;border:none;padding:4px;color:var(--locked-i)}
.x svg{width:28px;height:28px}
.lesson-top .bar{flex:1;margin:0}
.lesson-top .bar>i{background:var(--good)}
.lesson-body{flex:1;overflow-y:auto;padding-bottom:16px}
.qtype{font-size:20px;font-weight:900;margin:6px 0 14px}
.speak{display:flex;align-items:flex-end;gap:10px;margin-bottom:22px}
.speak .who{flex:none;width:96px;height:96px}
.bubble{position:relative;flex:1;min-width:0;border:2px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--surface);font-size:19px;font-weight:700;line-height:1.35;text-wrap:balance;margin-bottom:22px}
.bubble::after{content:"";position:absolute;bottom:18px;right:-9px;width:14px;height:14px;background:var(--surface);border:2px solid var(--line);border-left:none;border-bottom:none;transform:rotate(45deg)}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);font-size:18px;font-weight:700;transition:transform .06s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--muted);font-family:var(--mono)}
.opt.sel{border-color:#7FB0F5;background:color-mix(in srgb,#2F6FD6 10%,var(--surface));box-shadow:0 4px 0 #7FB0F5;color:#2F6FD6}
.opt.sel .k{border-color:#7FB0F5;color:#2F6FD6}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:0 4px 0 var(--good);color:var(--good-d)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad);color:var(--bad-d)}
.opt:disabled{cursor:default}
.tfgrid{grid-template-columns:1fr 1fr}
.tfgrid .opt{flex-direction:column;justify-content:center;padding:20px 10px;font-size:20px}
.tfgrid .opt svg{width:40px;height:40px;fill:currentColor}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:grid;gap:12px;align-content:start}
.match .opt{justify-content:center;text-align:center;font-size:16px;min-height:62px}
.match .opt.gone{opacity:.35;box-shadow:none;border-style:dashed;color:var(--muted)}
.check-bar{border-top:2px solid var(--line);background:var(--bg)}
.check-bar .wrap{display:flex;flex-direction:column;gap:12px;padding-block:16px 20px}
.check-bar.ok{background:var(--good-bg);border-color:transparent;animation:up .25s ease-out}
.check-bar.no{background:var(--bad-bg);border-color:transparent;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.fb{display:none;gap:10px;align-items:flex-start}
.check-bar.ok .fb,.check-bar.no .fb{display:flex}
.fb .ic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.fb .ic svg{width:28px;height:28px}
.check-bar.ok .fb .ic svg{fill:var(--good)} .check-bar.no .fb .ic svg{fill:var(--bad)}
.fb .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.fb strong{font-weight:900;font-size:22px}
.check-bar.ok .fb{color:var(--good-d)} .check-bar.no .fb{color:var(--bad-d)}
.fb span{font-size:16px;font-weight:500}
.cta{width:100%;border:none;border-radius:16px;padding:15px;font-size:18px;font-weight:900;letter-spacing:.04em;color:#fff;background:var(--good);box-shadow:0 5px 0 var(--good-d)}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--good-d)}
.cta:disabled{background:var(--locked);box-shadow:0 5px 0 var(--locked-d);color:var(--locked-i);cursor:default;transform:none}
.check-bar.no .cta{background:var(--bad);box-shadow:0 5px 0 var(--bad-d)}
.combo{font-weight:900;color:#F07A1C;font-size:15px;white-space:nowrap}

/* result */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:28px}
.result .who{width:150px;height:150px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4)}}
.result h2{font-weight:900;font-size:32px;margin:0;color:var(--brass)}
.result p{margin:0;color:var(--muted);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-top:10px}
.tile{border:2px solid var(--c);border-radius:16px;overflow:hidden;background:var(--c)}
.tile small{display:block;color:#fff;font-weight:900;font-size:13px;padding:4px;letter-spacing:.05em}
.tile b{direction:ltr;display:block;font-size:24px;font-variant-numeric:tabular-nums;font-family:var(--mono);background:var(--surface);color:var(--c);padding:12px 4px;border-radius:12px 12px 0 0}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.speak .who{width:72px;height:72px}.bubble{font-size:17px}.buddy{display:none}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#helmet"/></svg>ארסנל</div>
  <div class="pill streak" id="pStreak" title="רצף ימים"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 5.5 5 10.5A5 5 0 0 1 7 12.5c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg><span id="sStreak">0</span></div>
  <div class="pill xp" title="נקודות ניסיון"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span id="sXp">0</span></div>
  <div class="pill hearts" title="לבבות"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z"/></svg><span id="sHearts">5</span></div>
</div></header>

    <symbol id="e-safety" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5zm-1.2 14.2L7 12.4l1.4-1.4 2.4 2.4 4.8-4.8 1.4 1.4z"/></symbol>

   {t:"mc", q:"מהו 'כטב\"ם'?", a:["כלי טיס בלתי מאויש","כלי טנק כבד","כוח טקטי במבצע","סוג של רימון"], c:0, e:"בעולם קוראים לו גם רחפן או drone. ישראל היא מהחלוצות בתחום."}

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

/* sound */
let AC=null;
function tone(seq,type){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
 seq.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const s=t+i*.085;
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.12,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.2);
  o.connect(g).connect(AC.destination);o.start(s);o.stop(s+.22);});}catch(e){}}
const beep=ok=>ok?tone([660,880],"triangle"):tone([220,165],"square");
const fanfare=()=>tone([523,659,784,1047],"triangle");

/* confetti */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#confetti"),x=c.getContext("2d");c.hidden=false;
  const W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio;
  const cols=["#F0A81C","#2F6FD6","#3BA84A","#E0483B","#8A4FD1","#6E8B2E"];
  const P=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*16*devicePixelRatio,vy:(-Math.random()*16-6)*devicePixelRatio,r:Math.random()*6+4,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0]}));
  let f=0;(function step(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.45*devicePixelRatio;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;
    x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r*devicePixelRatio/2,-p.r*devicePixelRatio/4,p.r*devicePixelRatio,p.r*devicePixelRatio/2);x.restore();});
    if(++f<150)requestAnimationFrame(step);else c.hidden=true;})();
}

const lid=(u,i)=>u.id+":"+i;
function isUnlocked(ui,li){
  if(ui===0&&li===0) return true;
  const prev = li>0 ? lid(COURSE[ui],li-1) : lid(COURSE[ui-1],COURSE[ui-1].lessons.length-1);
  return !!S.done[prev];
}
function renderLearn(){
  const done=Object.keys(S.done).length;
  let firstOpen=null;
  const pct=Math.min(100,S.daily.xp/S.goal*100);
  let h=`<div class="wrap"><div class="daily"><svg class="chest" viewBox="0 0 48 48"><use href="#i-chest"/></svg>
    <div class="txt"><b>${S.daily.xp>=S.goal?"השגת את היעד היומי!":"יעד יומי: "+S.goal+" XP"}</b>

    <span class="pill xp" style="background:none">${S.daily.xp}/${S.goal}</span></div>`;

    const ud=u.lessons.filter((_,i)=>S.done[lid(u,i)]).length;

      <div class="txt"><div class="eyebrow">יחידה ${ui+1}</div><h2>${esc(u.title)}</h2><p>${esc(u.sub)}</p><span class="uprog">${ud}/${u.lessons.length}</span></div></div><div class="path">`;
    u.lessons.forEach((l,li)=>{
      const id=lid(u,li), d=S.done[id], open=isUnlocked(ui,li);
      const cur=open&&!d&&!firstOpen; if(cur) firstOpen=id;
      const away=ui%2?-1:1; /* buddy sits left on even units, right on odd: nodes swing the other way */
      const off=li===0?0:(li%2?away*70:away*35);
      h+=`<div class="node-wrap" style="transform:translateX(${off}px)">
        ${cur?`<svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="50" cy="50" r="46" fill="none" stroke="var(--u)" stroke-width="7" stroke-dasharray="70 300" stroke-linecap="round" transform="rotate(-90 50 50)"/></svg><div class="tip">התחל</div>`:""}
        <button class="node ${d?"done":""} ${!open?"locked":""}" data-u="${ui}" data-l="${li}" ${!open?'aria-disabled="true"':""} aria-label="${esc(l.name)}${!open?" (נעול)":""}">
        <svg><use href="#${!open?"i-lock":d?"i-check":"i-star"}"/></svg>${d?`<span class="crown">×${d}</span>`:""}</button>
        <div class="node-label">${esc(l.name)}</div></div>`;
    });
    // mascot buddy sits beside each unit's path, on the side the nodes don't swing to
    h+=`<svg class="buddy" style="${ui%2?"right":"left"}:2%" viewBox="0 0 64 64" aria-hidden="true"><use href="#helmet"/></svg></div></section>`;
  });
  h+=`<p class="view-sub" style="text-align:center;margin-top:34px">${done===TOTAL?"סיימת הכל. אפשר לחזור על כל שיעור ולצבור עוד XP.":"עוד יחידות בדרך."}</p></div>`;
  $("#app").innerHTML=h;
  document.querySelectorAll(".node").forEach(b=>b.onclick=()=>{
    const ui=+b.dataset.u, li=+b.dataset.l;

    startLesson(ui,li);
  });
  const cur=document.querySelector(".tip"); if(cur&&!render.scrolled){render.scrolled=1;cur.scrollIntoView({block:"center"});}
}

/* ------------------------------------------------------------------ lesson */
let L=null;
function startLesson(ui,li){
  const les=COURSE[ui].lessons[li];
  L={ui,li,qs:shuffle(les.qs),i:0,right:0,mistakes:[],state:"answer",sel:null,first:0,firstTotal:les.qs.length,combo:0};
  $("#lesson").hidden=false; document.body.style.overflow="hidden";
  if(S.hearts<=0) return outOfHearts();
  renderQ();
}
function close(){ $("#lesson").hidden=true; document.body.style.overflow=""; L=null; render(); }

function shell(inner,ctaLabel,ctaDisabled){
  const pct=L&&L.qs.length?Math.round(L.i/L.qs.length*100):100;
  $("#lesson").innerHTML=`<div class="wrap lesson-top">
     <button class="x" id="quit" aria-label="יציאה"><svg viewBox="0 0 24 24" fill="currentColor"><use href="#i-x"/></svg></button>
     <div class="bar"><i style="width:${pct}%"></i></div>
     ${L&&L.combo>=3?`<span class="combo">${L.combo} ברצף!</span>`:""}
     <div class="pill hearts" style="background:none"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z"/></svg><span id="lh">${S.hearts}</span></div>
   </div>
   <div class="lesson-body"><div class="wrap">${inner}</div></div>
   <div class="check-bar" id="cb"><div class="wrap"><div class="fb" id="fb"></div><button class="cta" id="cta" ${ctaDisabled?"disabled":""}>${ctaLabel}</button></div></div>`;
  $("#quit").onclick=close; $("#cta").onclick=onCta;
}
const speak=t=>`<div class="speak"><svg class="who" viewBox="0 0 64 64" aria-hidden="true"><use href="#helmet"/></svg><div class="bubble">${esc(t)}</div></div>`;

function renderQ(){
  const q=L.qs[L.i]; L.state="answer"; L.sel=null;
  const again=L.i>=L.firstTotal?`<div class="qtype" style="color:var(--bad);font-size:14px;margin-bottom:-8px">טעות קודמת, ננסה שוב</div>`:"";
  if(q.t==="mc"){
    L.order=shuffle(q.a.map((_,i)=>i));
    shell(`${again}<div class="qtype">בחר את התשובה הנכונה</div>${speak(q.q)}
      <div class="opts">${L.order.map((ai,k)=>`<button class="opt" data-a="${ai}"><span class="k">${k+1}</span>${esc(q.a[ai])}</button>`).join("")}</div>`,"בדיקה",true);
    bindOpts();
  } else if(q.t==="tf"){
    shell(`${again}<div class="qtype">נכון או לא נכון?</div>${speak(q.q)}
      <div class="opts tfgrid"><button class="opt" data-a="1"><svg><use href="#i-check"/></svg>נכון</button><button class="opt" data-a="0"><svg><use href="#i-x"/></svg>לא נכון</button></div>`,"בדיקה",true);
    bindOpts();
  } else renderMatch(q);
}
function bindOpts(){
  document.querySelectorAll(".opts .opt").forEach(b=>b.onclick=()=>{
    if(L.state!=="answer")return;
    document.querySelectorAll(".opts .opt").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); L.sel=+b.dataset.a; $("#cta").disabled=false; tone([520],"sine");
  });
}
function renderMatch(q){
  const left=shuffle(q.p.map((p,i)=>({i,s:p[0]}))), right=shuffle(q.p.map((p,i)=>({i,s:p[1]})));
  L.m={pick:null,miss:false,done:0};
  shell(`<div class="qtype">${esc(q.q)}</div>
    <div class="match"><div class="col">${left.map(x=>`<button class="opt" data-side="L" data-i="${x.i}">${esc(x.s)}</button>`).join("")}</div>
    <div class="col">${right.map(x=>`<button class="opt" data-side="R" data-i="${x.i}">${esc(x.s)}</button>`).join("")}</div></div>`,"המשך",true);
  document.querySelectorAll(".match .opt").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("gone")||L.state!=="answer")return;
    const m=L.m;
    if(!m.pick||m.pick.dataset.side===b.dataset.side){ if(m.pick)m.pick.classList.remove("sel"); m.pick=b; b.classList.add("sel"); return; }
    const a=m.pick,c=b; m.pick=null;
    if(a.dataset.i===c.dataset.i){ beep(true);
      [a,c].forEach(x=>{x.classList.remove("sel");x.classList.add("right");setTimeout(()=>{x.classList.remove("right");x.classList.add("gone");x.disabled=true;},350);});
      if(++m.done===q.p.length){ L.state="checked"; finishAnswer(!m.miss, m.miss?"היו כמה טעויות בדרך, אבל סיימת.":"התאמה מושלמת."); }
    } else { beep(false); m.miss=true;
      [a,c].forEach(x=>{x.classList.remove("sel");x.classList.add("wrong");setTimeout(()=>x.classList.remove("wrong"),450);});
    }
  });
}
function onCta(){
  if(L.state==="answer") return check();
  if(L.state==="checked") return next();
  if(L.state==="result") return close();
}
function check(){
  const q=L.qs[L.i]; if(L.sel===null)return;
  const ok = q.t==="mc" ? L.sel===q.c : (L.sel===1)===q.c;
  const correctVal = q.t==="mc" ? q.c : (q.c?1:0);
  document.querySelectorAll(".opts .opt").forEach(b=>{b.disabled=true;b.classList.remove("sel");
    if(+b.dataset.a===correctVal) b.classList.add("right"); else if(+b.dataset.a===L.sel) b.classList.add("wrong");});
  L.state="checked"; beep(ok);
  finishAnswer(ok,q.e);
}
function finishAnswer(ok,expl){
  const q=L.qs[L.i], firstPass=L.i<L.firstTotal;
  S.answered++; if(ok)S.correct++;
  if(ok){ L.right++; L.combo++; if(firstPass)L.first++; }
  else { L.combo=0; if(q.t!=="match")L.mistakes.push(q); S.hearts=Math.max(0,S.hearts-1); }
  save();
  const cb=$("#cb"); cb.classList.add(ok?"ok":"no");
  const praise=["מצוין!","בול!","יפה מאוד!","בדיוק!","אלוף!"][Math.random()*5|0];
  let answerLine="";
  if(!ok&&q.t==="mc") answerLine=`<span><b>התשובה הנכונה:</b> ${esc(q.a[q.c])}</span>`;
  if(!ok&&q.t==="tf") answerLine=`<span><b>התשובה הנכונה:</b> ${q.c?"נכון":"לא נכון"}</span>`;
  $("#fb").innerHTML=`<div class="ic"><svg><use href="#${ok?"i-check":"i-x"}"/></svg></div><div class="t"><strong>${ok?praise:"לא בדיוק"}</strong>${answerLine}<span>${esc(expl||"")}</span></div>`;
  const cta=$("#cta"); cta.disabled=false; cta.textContent="המשך"; cta.focus();
  $("#lh").textContent=S.hearts; stats();
}
function next(){
  if(S.hearts<=0) return outOfHearts();
  L.i++;
  if(L.i===L.qs.length && L.mistakes.length){ L.qs=L.qs.concat(L.mistakes); L.mistakes=[]; }
  if(L.i>=L.qs.length) return result();
  renderQ();
}
function countUp(el,to){let v=0;const st=Math.max(1,Math.ceil(to/20));const t=setInterval(()=>{v=Math.min(to,v+st);el.textContent="+"+v;if(v>=to)clearInterval(t);},40);}
function result(){
  const id=lid(COURSE[L.ui],L.li);
  const perfect=L.first===L.firstTotal;
  const gained=10+L.first*2+(perfect?5:0);
  const before=BADGES.filter(earned).length;
  S.xp+=gained; S.daily.xp+=gained; S.done[id]=(S.done[id]||0)+1; if(perfect)S.perfect++;
  const t=todayStr(); if(S.last!==t){ const diff=S.last?(new Date(t)-new Date(S.last))/864e5:99; S.streak=diff===1?S.streak+1:1; S.last=t; }
  S.best=Math.max(S.best||0,S.streak);
  save(); L.state="result";
  const newB=BADGES.filter(earned).length-before;
  const acc=Math.round(L.first/L.firstTotal*100);
  shell(`<div class="result"><svg class="who" viewBox="0 0 64 64"><use href="#helmet"/></svg>
    <h2>${perfect?"שיעור מושלם!":"השיעור הושלם!"}</h2><p>${esc(COURSE[L.ui].lessons[L.li].name)}${newB?` · קיבלת ${newB>1?newB+" עיטורים חדשים":"עיטור חדש"}!`:""}</p>
    <div class="tiles">
      <div class="tile" style="--c:var(--brass)"><small>XP</small><b id="gxp">+0</b></div>
      <div class="tile" style="--c:var(--good)"><small>דיוק</small><b>${acc}%</b></div>
      <div class="tile" style="--c:#F07A1C"><small>רצף</small><b>${S.streak}</b></div></div></div>`,"המשך",false);
  countUp($("#gxp"),gained); fanfare(); confetti(); stats();
}
function outOfHearts(){
  L.state="result";
  shell(`<div class="result"><svg class="who" viewBox="0 0 64 64"><use href="#helmet"/></svg>
    <h2 style="color:var(--bad)">נגמרו הלבבות</h2><p>הלבבות יתמלאו מחר. אפשר בינתיים לעבור על ההסברים בשיעורים שכבר סיימת.</p></div>`,"חזרה למסלול",false);
}

document.addEventListener("keydown",e=>{
  if(!L||$("#lesson").hidden)return;
  if(e.key==="Escape")return close();
  if(e.key==="Enter"){ const c=$("#cta"); if(c&&!c.disabled){e.preventDefault();c.click();} return; }
  const n=parseInt(e.key,10); if(n>=1&&n<=4&&L.state==="answer"){ const b=document.querySelectorAll(".opts .opt")[n-1]; if(b)b.click(); }
});

render();
</script>
