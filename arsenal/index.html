/* ---- versus: which came first */
const VS_KINDS={
  year:{q:"איזה נשק הופיע קודם?",get:w=>/^\d{4}$/.test(w.year)?+w.year:null,show:w=>w.year,low:1,gap:3},
  kg:{q:"איזה נשק כבד יותר?",get:w=>vsNum(w.kg),show:w=>`${vsNum(w.kg)} ק"ג`,low:0,ratio:1.3},
  rng:{q:"לאיזה נשק טווח אפקטיבי ארוך יותר?",get:w=>vsNum(w.rng),show:w=>`${vsNum(w.rng)} מ'`,low:0,ratio:1.4},
  mag:{q:"באיזה נשק יש יותר כדורים במחסנית?",get:w=>/חגור/.test(w.mag)?null:vsNum(w.mag),show:w=>`${vsNum(w.mag)} כדורים`,low:0,ratio:1.4},
};
function vsNum(x){const m=String(x).replace(/,/g,"").match(/\d+(\.\d+)?/);return m?+m[0]:null;}
function renderVs(q,kick,tm){
  const kind=q.k||shuffle(Object.keys(VS_KINDS))[0], K=VS_KINDS[kind];
  const pool=WEAPONS.filter(w=>!w.gen&&K.get(w)!==null&&(!q.f||w.type.startsWith(q.f)));
  let a,b,ok=false;
  for(let t=0;t<80&&!ok;t++){ [a,b]=shuffle(pool); const x=K.get(a),y=K.get(b); ok=K.gap?Math.abs(x-y)>=K.gap:Math.max(x,y)/Math.min(x,y)>=K.ratio; }
  const x=K.get(a), y=K.get(b), win=K.low?(x<y?0:1):(x>y?0:1);
  L.cur={t:"mc",a:[a.n,b.n],c:win,e:`${a.n}: ${K.show(a)}. ${b.n}: ${K.show(b)}.`};
  frame(`${kick}<h1 class="l-title">${esc(q.q||K.q)}</h1>${q.f?`<p class="part-sub">שני ${esc(typePlural(q.f))}, אחד מול השני</p>`:""}
    <div class="opts vs-grid">${[a,b].map((w,k)=>`<button class="opt vs-card ${k?"from-l":"from-r"}" data-a="${k}">${silSvg(w)}<b>${esc(w.n)}</b><small>${esc(w.type)}</small><span class="vs-yr" hidden>${esc(K.show(w))}</span></button>`).join("")}<span class="vs-badge">VS</span></div>`,"בדיקה",true,"",tm);
  bindChoice();
}

/* ---- missing part: one part of the drawing is covered; name the hidden part */
/* a part is "clean" when its box hides little of the other parts, so the cover does not give away or blur another answer */
function missClean(P,k){
  const r=P[k], ov=(a,b)=>Math.max(0,Math.min(a[1]+a[3],b[1]+b[3])-Math.max(a[1],b[1]))*Math.max(0,Math.min(a[2]+a[4],b[2]+b[4])-Math.max(a[2],b[2]));
  return Object.keys(P).filter(k2=>k2!==k).reduce((t,k2)=>t+ov(r,P[k2]),0)/(r[3]*r[4])<.2;
}
function renderMiss(q,kick,tm){

  const P=PARTS[w.sil], keys=Object.keys(P), clean=keys.filter(k=>missClean(P,k)), key=q.p&&P[q.p]?q.p:shuffle(clean.length?clean:keys)[0], [name,x,y,pw,ph]=P[key];
  const wrong=shuffle(keys.filter(k=>k!==key)).slice(0,3).map(k=>P[k][0]);
  L.cur={t:"mc",a:[name,...wrong],c:0,e:`חסר כאן: ${name}. `+(PART_INFO[w.sil+":"+key]||PART_INFO[key]||"")}; L.curW=w.id;

/* ---- rank: order weapons by weight or range, built fresh from the armory data each time */
const RANK_KINDS={
  kg:{q:"סדר מהקל לכבד",get:w=>vsNum(w.kg),show:v=>`${v} ק"ג`},
  rng:{q:"סדר מהטווח הקצר לארוך",get:w=>vsNum(w.rng),show:v=>`${v} מ'`},
  year:{q:"סדר מהישן לחדש",get:w=>/^\d{4}$/.test(w.year)?+w.year:null,show:v=>v},
};
const typePlural=f=>({"מקלע":"מקלעים","אקדח":"אקדחים","רובה":"רובים","תת-מקלע":"תת-מקלעים"})[f]||f;
function buildRank(q){
  const k=RANK_KINDS[q.k]?q.k:shuffle(Object.keys(RANK_KINDS))[0], K=RANK_KINDS[k], n=q.n||4;
  const far=(a,b)=>k==="year"?Math.abs(a-b)>=8:Math.max(a,b)/Math.min(a,b)>=1.25;
  const pick=[];
  for(const w of shuffle(WEAPONS.filter(w=>!w.gen&&K.get(w)&&(!q.f||w.type.startsWith(q.f))))){ const v=K.get(w); if(pick.every(x=>far(K.get(x),v))) pick.push(w); if(pick.length===n) break; }
  pick.sort((a,b)=>K.get(a)-K.get(b));
  q.items=pick.map(w=>w.n); q.q=q.f?`${K.q} (רק ${typePlural(q.f)})`:K.q; q.e=pick.map(w=>`${w.n}: ${K.show(K.get(w))}`).join(" · ")+".";
}

const BLITZ_SEC=60;

}
function finishBlitz(){

  S.blitzBest=Math.max(best,score); S.xp+=xp; S.daily.xp+=xp; S.days[today()]=(S.days[today()]||0)+xp; save();
  L.state="done"; L.i=L.qs.length;
  frame(`<div class="done-screen">${mascot("happy","who jump big-kd")}<h2 class="pop-in">${rec?"שיא חדש!":"הזמן נגמר!"}</h2>

    <div class="res" style="grid-template-columns:1fr 1fr"><div class="r pop-in" style="--c:var(--gold);--d:3"><small>XP</small><b>${ico("i-bolt")}${xp}</b></div>

    <div id="stq" hidden><h2 class="st-q">${esc(q.q)}</h2><div class="opts">${L.order.map((ai,k)=>optBtn(ai,k,q.a[ai])).join("")}</div></div>`,"המשך",false);
  bindChoice(); storyNext();
}
function storyNext(){
  const q=L.qs[L.i], box=$("#stl"); if(!box) return;
  if(L.storyStep<q.lines.length){
    const line=q.lines[L.storyStep++], el=document.createElement("div"); el.className="st-line";
    el.innerHTML=`${spk(line)}<p>${esc(line)}</p>`; box.appendChild(el); sfx.tap();
    el.scrollIntoView({block:"nearest",behavior:RM()?"auto":"smooth"});
    $("#go").textContent=L.storyStep<q.lines.length?"המשך":"לשאלה";
    return;
  }
  L.storyDone=true; const qb=$("#stq"); qb.hidden=false; qb.classList.add("st-reveal"); sfx.pop();
  const go=$("#go"); go.textContent="בדיקה"; go.disabled=true;
  qb.scrollIntoView({block:"start",behavior:RM()?"auto":"smooth"});
}

/* ---- teach first: cards built from the lesson's own content, shown before the questions */
function teachCards(qs,key){
  const cards=(LESSON_DIAG[key]||[]).map(d=>({k:"diag",d})), seenW=new Set();
  for(const q of qs){
    if(q.t==="story") continue;
    if(q.w&&WMAP[q.w]){ if(!seenW.has(q.w)){ seenW.add(q.w); cards.push({k:"w",w:WMAP[q.w]}); } continue; }
    if(q.t==="mc"||q.t==="gap") cards.push({k:"fact",q:q.t==="gap"?q.s.replace("___","…"):q.q,a:q.a[q.c],e:q.e});
    else if(q.t==="tf") cards.push({k:"tf",q:q.q,v:q.c,e:q.e});
    else if(q.t==="match") cards.push({k:"match",q:q.q,p:q.p});
    else if(q.t==="order") cards.push({k:"order",q:q.q,items:q.items,e:q.e});
  }
  return cards.slice(0,8);
}
function startTeach(){ L.state="teach"; L.tIdx=0; renderTeach(); }
function renderTeach(){
  const c=L.teach[L.tIdx], n=L.teach.length, last=L.tIdx===n-1;
  let body="";
  if(c.k==="w"){ const w=c.w; body=`<div class="id-card tc-art">${silSvg(w,"sil")}</div><h2 class="tc-big">${esc(w.n)}</h2>
      <div class="tc-chips"><span>${esc(w.type)}</span><span>${esc(w.country)}</span><span>${esc(w.year)}</span><span>${esc(w.cal)}</span></div><p class="tc-e">${esc(w.fact)}</p>`; }
  else if(c.k==="diag"){ const D=DIAGRAMS[c.d]; body=`<h2 class="tc-big">${esc(D.title)}</h2><div class="diag">${D.svg}</div><p class="tc-e">${esc(D.text)}</p>`; }
  else if(c.k==="fact") body=`<p class="tc-q">${esc(c.q)}</p><h2 class="tc-big">${esc(c.a)}</h2>${c.e?`<p class="tc-e">${esc(c.e)}</p>`:""}`;
  else if(c.k==="tf") body=`<p class="tc-q">${esc(c.q)}</p><h2 class="tc-big ${c.v?"tc-yes":"tc-no"}">${ico(c.v?"i-check":"i-x")}${c.v?"נכון":"לא נכון"}</h2>${c.e?`<p class="tc-e">${esc(c.e)}</p>`:""}`;
  else if(c.k==="match") body=`<p class="tc-q">${esc(c.q)}</p><div class="tc-pairs">${c.p.map(([a,b])=>`<div><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("")}</div>`;
  else if(c.k==="order") body=`<p class="tc-q">${esc(c.q)}</p><ol class="tc-list">${c.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>${c.e?`<p class="tc-e">${esc(c.e)}</p>`:""}`;
  const say=c.k==="diag"?`${DIAGRAMS[c.d].title}. ${DIAGRAMS[c.d].text}`:c.k==="w"?`${c.w.n}. ${c.w.fact}`:c.k==="fact"?`${c.q} ${c.a}. ${c.e||""}`:c.k==="tf"?`${c.q} ${c.v?"נכון":"לא נכון"}. ${c.e||""}`:c.q;
  frame(`<div class="tc-top"><div class="l-kicker legend">${ico("i-book")}לומדים לפני שמתרגלים · ${L.tIdx+1} מתוך ${n}</div><button class="tc-skip" id="tcSkip">דלג לתרגול</button></div>
    ${L.tIdx===0?`<div class="speak tc-intro">${mascot("happy","who in-hop")}<div class="bubble b-in">בוא נלמד את החומר של השיעור, ואחר כך נתרגל.</div></div>`:""}
    <div class="tc-card" key="${L.tIdx}">${spk(say)}${body}</div>
    <div class="tc-dots">${L.teach.map((_,i)=>`<i class="${i<L.tIdx?"done":i===L.tIdx?"on":""}"></i>`).join("")}</div>`,last?"בוא נתרגל!":"הבא",false);
  $("#tcSkip").onclick=()=>teachDone();
}

/* ---- account: progress is kept in the viewer's Claude account (db: data/users/<id>/progress) */
const AUTH_KEY="arsenal-auth";
var ACC={state:"wait",db:null,user:null,id:null,name:"",avatar:"",sync:"",q:Promise.resolve(),timer:0};
const authFlag=()=>{try{return localStorage.getItem(AUTH_KEY);}catch(e){return null;}};
const setAuth=v=>{try{localStorage.setItem(AUTH_KEY,v);}catch(e){}};
const progRef=()=>ACC.db.doc("data/users/"+ACC.id+"/progress");
function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.classList.add("bye"),2200); setTimeout(()=>t.parentNode&&t.parentNode.removeChild(t),2600);
}
function dropEl(id){ const e=document.getElementById(id); if(e&&e.parentNode) e.parentNode.removeChild(e); }
function cloudWrite(){
  const snap=JSON.stringify(S);
  ACC.q=ACC.q.then(()=>progRef().set({s:snap,t:S.t||Date.now(),v:1})).then(()=>{ACC.sync="ok";syncDot();},()=>{ACC.sync="err";syncDot();});
  return ACC.q;
}
function cloudPush(){
  if(!ACC||ACC.state!=="in") return;
  ACC.sync="pending"; syncDot(); clearTimeout(ACC.timer); ACC.timer=setTimeout(cloudWrite,1500);
}
function syncDot(){ const e=$("#syncTxt"); if(e) e.textContent=({ok:"ההתקדמות שמורה בחשבון",pending:"שומר...",err:"לא הצלחתי לשמור, אנסה שוב"})[ACC.sync]||"מחובר"; }
function adopt(cloud){
  const keep={mute:S.mute};
  S={...fresh(),...cloud,...keep}; migrateParts2(S);
  if(!S.daily||S.daily.d!==today()) S.daily={d:today(),xp:0};
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
}
async function logIn(auto){
  if(!ACC.db||!ACC.id) return false;
  ACC.state="busy"; if(!auto) render();
  try{
    const d=await progRef().get();
    let cloud=null; if(d.exists){ try{cloud=JSON.parse(d.data().s);}catch(e){} }
    const localHas=lessonsDone()>0||S.xp>0;
    if(cloud&&(!localHas||!auto||(cloud.t||0)>=(S.t||0))) adopt(cloud);
    ACC.state="in"; setAuth("in");
    if(!cloud||(S.t||0)>(cloud.t||0)) await cloudWrite(); else ACC.sync="ok";
    dropEl("onb"); dropEl("gate");
    regenHearts(); leagueTick(); qState(); render();
    if(!auto||cloud) toast(`ברוך שובך${ACC.name?", "+ACC.name:""}!`);
    return true;
  }catch(e){ ACC.state=authFlag()==="out"?"out":"none"; render(); toast("ההתחברות נכשלה, נסה שוב"); return false; }
}
async function logOut(){
  clearTimeout(ACC.timer);
  if(ACC.state==="in"){ try{await cloudWrite();}catch(e){} }
  ACC.state="out"; setAuth("out");
  const mute=S.mute; S=fresh(); S.mute=mute; S.onboarded=1;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  regenHearts(); leagueTick(); qState();
  closeSheet(); tab="learn"; render(); scrollTo(0,0); showGate();
}
function avatarHtml(cls){
  const u=ACC.avatar; const ok=/^(https:\/\/|data:image\/|\/)/.test(u||"");
  return ok?`<img class="${cls}" alt="" src="${esc(u)}">`:`<span class="${cls} av-letter">${esc((ACC.name||"?").slice(0,1))}</span>`;
}
function accountCard(){
  if(ACC.state==="in") return `<div class="card acct">${avatarHtml("acct-av")}<div class="acct-t"><b>${esc(ACC.name||"החשבון שלי")}</b><small id="syncTxt"></small></div><button class="btn ghost small" id="acctOut">התנתק</button></div>`;
  if((ACC.state==="out"||ACC.state==="busy")&&ACC.db) return `<div class="card acct">${kasdi("acct-av")}<div class="acct-t"><b>אתה לא מחובר</b><small>התחבר כדי לשמור את ההתקדמות בחשבון</small></div><button class="btn small" id="acctIn" ${ACC.state==="busy"?"disabled":""}>התחבר</button></div>`;
  return "";
}
function bindAccount(){
  syncDot();
  const o=$("#acctOut"); if(o) o.onclick=()=>{ sheet(`<div class="center">${kasdi("big")}<h2>להתנתק?</h2><p class="page-sub" style="margin:0">ההתקדמות שלך שמורה בחשבון, והיא תחזור כשתתחבר שוב.</p>
    <button class="btn wide red" id="yes">התנתק</button><button class="btn wide ghost" id="sx">ביטול</button></div>`); $("#yes").onclick=logOut; $("#sx").onclick=closeSheet; };
  const i=$("#acctIn"); if(i) i.onclick=()=>logIn(false);
}
function showGate(){
  if($("#gate")) return;
  const g=document.createElement("div"); g.className="onb gate"; g.id="gate"; document.body.appendChild(g);
  const draw=()=>{
    if(!document.getElementById("gate")) return;
    const ready=ACC.db&&ACC.id, busy=ACC.state==="busy"||ACC.state==="wait";
    g.innerHTML=`<div class="gate-body">${mascot("happy","who jump big-kd")}<h1 class="gate-title">ארסנל</h1><p class="page-sub">לומדים על נשק, שיעור אחרי שיעור.</p></div>
     <div class="gate-foot">${ready?`<button class="btn wide" id="gIn">${ACC.avatar?avatarHtml("gate-av"):""}<span>${ACC.name?"התחבר בתור "+esc(ACC.name):"התחבר"}</span></button>`
       :busy?`<button class="btn wide" disabled>מתחבר...</button>`:`<p class="page-sub" style="margin:0 0 6px">ההתחברות עובדת כשפותחים את האפליקציה בתוך Claude.</p>`}
     <button class="btn wide ghost" id="gGuest">המשך בלי חשבון</button></div>`;
    const b=$("#gIn"); if(b) b.onclick=async()=>{ b.disabled=true; const ok=await logIn(false); if(!ok) draw(); };
    $("#gGuest").onclick=()=>{ g.classList.add("bye"); setTimeout(()=>dropEl("gate"),250); };
  };
  showGate.draw=draw; draw();
}
async function initAccount(){
  const use=window.claude&&typeof window.claude.use==="function"?n=>Promise.resolve(window.claude.use(n)).catch(()=>null):null;
  if(!use){ ACC.state=authFlag()==="out"?"out":"none"; showGate.draw&&showGate.draw(); return; }
  const [db,user]=await Promise.all([use("db"),use("user")]);
  ACC.db=db; ACC.user=user;
  if(user){ try{ ACC.id=await user.id(); const me=await user.me(); ACC.name=(me&&me.name)||""; ACC.avatar=(me&&me.avatarUrl)||""; }catch(e){} }
  if(!db||!ACC.id){ ACC.state=authFlag()==="out"?"out":"none"; showGate.draw&&showGate.draw(); render(); return; }
  if(authFlag()==="out"){ ACC.state="out"; showGate.draw&&showGate.draw(); render(); return; }
  await logIn(true);
}

/* ---- boot */
regenHearts(); leagueTick(); qState(); save();
if(authFlag()==="out"){ S.onboarded=1; save(); render(); showGate(); }
else if(!S.onboarded&&!Object.keys(S.done).length){ render(); onboarding(); } else { S.onboarded=1; save(); render(); }
initAccount();
</script>
