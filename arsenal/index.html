<title>ארסנל</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single phone-width column — top status bar (streak / XP / hearts), a winding lesson path, and a full-screen lesson sheet. */
:root{
  --bg:#E7EBE1;        /* field-grey paper, biased to olive */
  --surface:#F6F8F2;
  --ink:#1E2416;
  --muted:#5C6650;
  --line:#C9D0BC;
  --olive:#4E5E2B;     /* primary: olive drab */
  --olive-2:#6C7F3C;
  --olive-shadow:#36421C;
  --brass:#B9822A;     /* accent: cartridge brass */
  --brass-shadow:#8A5F1A;
  --good:#2F8A3E; --good-bg:#DDF0DB;
  --bad:#B8352B;  --bad-bg:#F7DEDA;
  --locked:#B9BFAE; --locked-shadow:#9AA08E;
  --font-display:"Secular One","Assistant",system-ui,sans-serif;
  --font-body:"Assistant","Heebo",system-ui,-apple-system,"Arial Hebrew",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141810; --surface:#1D2317; --ink:#E6EBDC; --muted:#9AA58A; --line:#323B27;
  --olive:#8CA34C; --olive-2:#A3BB5E; --olive-shadow:#5B6B2C;
  --brass:#D9A548; --brass-shadow:#9C7428;
  --good:#6CC47A; --good-bg:#1E3522; --bad:#EE7A6E; --bad-bg:#3D1F1B;
  --locked:#3A4330; --locked-shadow:#2A3122; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141810; --surface:#1D2317; --ink:#E6EBDC; --muted:#9AA58A; --line:#323B27;
  --olive:#8CA34C; --olive-2:#A3BB5E; --olive-shadow:#5B6B2C;
  --brass:#D9A548; --brass-shadow:#9C7428;
  --good:#6CC47A; --good-bg:#1E3522; --bad:#EE7A6E; --bad-bg:#3D1F1B;
  --locked:#3A4330; --locked-shadow:#2A3122; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;direction:rtl}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--font-display);font-size:26px;color:var(--olive);letter-spacing:.5px;margin-inline-end:auto;display:flex;align-items:center;gap:8px}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums}
.stat svg{width:22px;height:22px}
.stat.streak{color:var(--brass)} .stat.xp{color:var(--olive)} .stat.hearts{color:var(--bad)}

/* home */
.hero{display:flex;gap:14px;align-items:center;padding-block:20px 6px}
.hero p{margin:0;color:var(--muted)}
.hero h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:24px;text-wrap:balance}
.mascot{flex:none;width:72px;height:72px}
.goal{display:flex;align-items:center;gap:10px;margin-block:10px 4px;font-weight:700;font-size:15px;color:var(--muted)}
.bar{flex:1;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brass);border-radius:99px;transition:width .4s}

.unit{margin-block:26px 8px}
.unit-head{border-radius:var(--r);padding:14px 18px;color:#fff;background:var(--olive);box-shadow:0 4px 0 var(--olive-shadow)}
.unit-head .eyebrow{font-size:13px;letter-spacing:.06em;opacity:.85;font-weight:700}
.unit-head h2{margin:2px 0 0;font-family:var(--font-display);font-weight:400;font-size:22px}
.unit-head p{margin:2px 0 0;font-size:15px;opacity:.9}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:22px 4px}
.node{position:relative;width:74px;height:68px;border:none;border-radius:50%;background:var(--olive-2);box-shadow:0 7px 0 var(--olive-shadow);display:grid;place-items:center;transition:transform .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--olive-shadow)}
.node svg{width:32px;height:32px;fill:#fff}
.node.done{background:var(--brass);box-shadow:0 7px 0 var(--brass-shadow)}
.node.locked{background:var(--locked);box-shadow:0 7px 0 var(--locked-shadow);cursor:not-allowed}
.node.current::after{content:"התחל";position:absolute;top:-34px;background:var(--surface);color:var(--olive);border:2px solid var(--line);font-weight:800;font-size:14px;padding:2px 12px;border-radius:10px;animation:bob 1.6s ease-in-out infinite}
.node .crown{position:absolute;bottom:-6px;inset-inline-start:-4px;background:var(--surface);border:2px solid var(--line);border-radius:99px;font-size:12px;font-weight:800;padding:0 6px;color:var(--brass);font-family:var(--font-mono)}
@keyframes bob{50%{transform:translateY(-4px)}}
.node-label{font-size:14px;color:var(--muted);font-weight:600;margin-top:-6px;text-align:center}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.foot{color:var(--muted);font-size:14px;text-align:center;padding-block:30px 40px}
.linkbtn{background:none;border:none;color:var(--olive);text-decoration:underline;font-weight:700;padding:0}

/* lesson sheet */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lesson-top{display:flex;align-items:center;gap:14px;padding-block:14px}
.x{background:none;border:none;padding:4px;color:var(--muted)}
.x svg{width:26px;height:26px}
.lesson-body{flex:1;overflow-y:auto}
.qtype{font-size:14px;font-weight:800;color:var(--brass);letter-spacing:.05em;margin-block:8px 4px}
.qtext{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.3;margin:0 0 20px;text-wrap:balance}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);font-size:18px;font-weight:600}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);font-family:var(--font-mono)}
.opt.sel{border-color:var(--olive-2);background:color-mix(in srgb,var(--olive-2) 14%,var(--surface));box-shadow:0 4px 0 var(--olive-2)}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:0 4px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad)}
.opt:disabled{cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:grid;gap:12px;align-content:start}
.match .opt{justify-content:center;text-align:center;font-size:16px;min-height:60px}
.match .opt.gone{opacity:.35;box-shadow:none;border-style:dashed}
.check-bar{border-top:2px solid var(--line);transition:background .2s}
.check-bar .wrap{display:flex;flex-direction:column;gap:12px;padding-block:16px 20px}
.check-bar.ok{background:var(--good-bg);border-color:transparent}
.check-bar.no{background:var(--bad-bg);border-color:transparent}
.fb{display:none;gap:4px;flex-direction:column}
.check-bar.ok .fb,.check-bar.no .fb{display:flex}
.fb strong{font-family:var(--font-display);font-weight:400;font-size:22px}
.check-bar.ok .fb strong{color:var(--good)} .check-bar.no .fb strong{color:var(--bad)}
.fb span{font-size:16px}
.cta{width:100%;border:none;border-radius:14px;padding:14px;font-size:18px;font-weight:800;letter-spacing:.03em;color:#fff;background:var(--olive-2);box-shadow:0 5px 0 var(--olive-shadow)}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--olive-shadow)}
.cta:disabled{background:var(--locked);box-shadow:0 5px 0 var(--locked-shadow);color:var(--muted);cursor:default;transform:none}
.check-bar.ok .cta{background:var(--good);box-shadow:0 5px 0 color-mix(in srgb,var(--good) 60%,#000)}
.check-bar.no .cta{background:var(--bad);box-shadow:0 5px 0 color-mix(in srgb,var(--bad) 60%,#000)}

/* result */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:40px}
.result h2{font-family:var(--font-display);font-weight:400;font-size:30px;margin:0;color:var(--brass)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--surface)}
.tile b{display:block;font-size:24px;font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
.tile small{color:var(--muted);font-weight:700}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><use href="#helmet"/></svg>ארסנל</div>

</div></header>

</svg>

<main class="wrap" id="home"></main>
<section class="lesson" id="lesson" hidden></section>

<script>
/* ------------------------------------------------------------------

   terminology and safety. q types: mc (choice), tf (true/false), match.
------------------------------------------------------------------ */
const COURSE = [
 { id:"safety", title:"בטיחות קודם כל", sub:"הכללים שכל אחד צריך להכיר", lessons:[

   {t:"match", q:"התאם כל כלל לפירוש שלו", p:[["נשק טעון","תמיד מניחים שכן"],["כיוון הקנה","רק לכיוון בטוח"],["אצבע","מחוץ להדק"],["המטרה","לזהות, וגם מה מאחוריה"]]}
  ]},
  { name:"מצאתי משהו חשוד", qs:[

   {t:"tf", q:"תחמושת חלודה וישנה כבר לא מסוכנת.", c:false, e:"חומרי נפץ ישנים יכולים להיות אפילו פחות יציבים מחדשים."},
   {t:"mc", q:"איך מאחסנים נשק בבית באופן בטוח?", a:["נעול בכספת, והתחמושת בנפרד","בארון הבגדים","מתחת למיטה, כדי שיהיה זמין","במגירה במטבח"], c:0, e:"אחסון נעול מונע גישה של ילדים ושל גורמים לא מורשים."},

 ]},
 { id:"history", title:"היסטוריה של הנשק", sub:"מאבק שריפה ועד הטנק הראשון", lessons:[
  { name:"ההתחלה", qs:[
   {t:"mc", q:"באיזו ארץ הומצא אבק השריפה?", a:["סין","יוון","מצרים","אנגליה"], c:0, e:"אלכימאים סינים גילו אותו בערך במאה ה-9, ככל הנראה בזמן חיפוש אחרי סם חיים."},

 ]},
 { id:"israel", title:"תוצרת ישראל", sub:"נשק ומערכות שפותחו כאן", lessons:[

/* ------------------------------------------------------------------ state */
const KEY="arsenal-v1";
const todayStr=()=>new Date().toISOString().slice(0,10);
let S={xp:0,hearts:5,streak:0,last:null,done:{},daily:{d:null,xp:0},heartsDay:null};
try{const raw=localStorage.getItem(KEY); if(raw) S={...S,...JSON.parse(raw)};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
// daily refills
if(S.heartsDay!==todayStr()){S.hearts=5;S.heartsDay=todayStr();}
if(S.daily.d!==todayStr()) S.daily={d:todayStr(),xp:0};
if(S.last){const diff=(new Date(todayStr())-new Date(S.last))/864e5; if(diff>1) S.streak=0;}
save();
const GOAL=50;

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

/* sound: tiny synth, only after user gesture */
let AC=null;
function beep(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
 (ok?[660,880]:[220,170]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?"triangle":"square";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(.12,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.18);
  o.connect(g).connect(AC.destination);o.start(t+i*.09);o.stop(t+i*.09+.2);});}catch(e){}}

function stats(){ $("#sStreak").textContent=S.streak; $("#sXp").textContent=S.xp; $("#sHearts").textContent=S.hearts; }

/* ------------------------------------------------------------------ home */
const lid=(u,i)=>u.id+":"+i;
function isUnlocked(ui,li){
  if(ui===0&&li===0) return true;
  const prev = li>0 ? lid(COURSE[ui],li-1) : lid(COURSE[ui-1],COURSE[ui-1].lessons.length-1);
  return !!S.done[prev];
}
function renderHome(){
  stats();
  const total=COURSE.reduce((n,u)=>n+u.lessons.length,0), done=Object.keys(S.done).length;
  let firstOpen=null;
  let h=`<div class="hero"><svg class="mascot" viewBox="0 0 64 64" aria-hidden="true"><use href="#helmet"/></svg>
    <div><h1>${done===0?"ברוך הבא לטירונות!":done===total?"סיימת את כל הקורס. כל הכבוד!":"ממשיכים להתקדם"}</h1>
    <p>${done} מתוך ${total} שיעורים הושלמו</p></div></div>
    <div class="goal">יעד יומי<div class="bar"><i style="width:${Math.min(100,S.daily.xp/GOAL*100)}%"></i></div><span style="font-family:var(--font-mono)">${S.daily.xp}/${GOAL} XP</span></div>`;
  COURSE.forEach((u,ui)=>{
    h+=`<section class="unit"><div class="unit-head"><div class="eyebrow">יחידה ${ui+1}</div><h2>${esc(u.title)}</h2><p>${esc(u.sub)}</p></div><div class="path">`;
    u.lessons.forEach((l,li)=>{
      const id=lid(u,li), d=S.done[id], open=isUnlocked(ui,li);
      const cur=open&&!d&&!firstOpen; if(cur) firstOpen=id;
      const off=[0,-60,0,60][(li+ui)%4];
      h+=`<div class="node-wrap" style="transform:translateX(${off}px)">
        <button class="node ${d?"done":""} ${!open?"locked":""} ${cur?"current":""}" data-u="${ui}" data-l="${li}" ${!open?'aria-disabled="true"':""} aria-label="${esc(l.name)}${!open?" (נעול)":""}">
        <svg><use href="#${!open?"i-lock":d?"i-check":"i-star"}"/></svg>${d?`<span class="crown">×${d}</span>`:""}</button>
        <div class="node-label">${esc(l.name)}</div></div>`;
    });
    h+=`</div></section>`;
  });
  h+=`<p class="foot">לבבות מתמלאים מחדש כל יום. <button class="linkbtn" id="reset">איפוס התקדמות</button></p>`;
  $("#home").innerHTML=h;
  document.querySelectorAll(".node").forEach(b=>b.onclick=()=>{
    const ui=+b.dataset.u, li=+b.dataset.l;
    if(!isUnlocked(ui,li)){b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");return;}
    startLesson(ui,li);
  });
  let armed=false;
  $("#reset").onclick=e=>{ if(!armed){armed=true;e.target.textContent="לחץ שוב לאישור";setTimeout(()=>{armed=false;e.target.textContent="איפוס התקדמות";},3000);return;}
    S={xp:0,hearts:5,streak:0,last:null,done:{},daily:{d:todayStr(),xp:0},heartsDay:todayStr()};save();renderHome();};
}

/* ------------------------------------------------------------------ lesson */
let L=null;
function startLesson(ui,li){
  const u=COURSE[ui], les=u.lessons[li];
  if(S.hearts<=0){ showNoHearts(); return; }
  L={ui,li,qs:shuffle(les.qs),i:0,right:0,mistakes:[],xp:0,state:"answer",sel:null};
  $("#lesson").hidden=false; document.body.style.overflow="hidden";
  renderQ();
}
function close(){ $("#lesson").hidden=true; document.body.style.overflow=""; L=null; renderHome(); }

function shell(inner,ctaLabel,ctaDisabled){
  const pct=L?Math.round(L.i/L.qs.length*100):100;
  $("#lesson").innerHTML=`<div class="wrap lesson-top">
     <button class="x" id="quit" aria-label="יציאה"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg></button>
     <div class="bar"><i style="width:${pct}%;background:var(--olive-2)"></i></div>
     <div class="stat hearts"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z"/></svg><span>${S.hearts}</span></div>
   </div>
   <div class="lesson-body"><div class="wrap">${inner}</div></div>
   <div class="check-bar" id="cb"><div class="wrap"><div class="fb" id="fb"></div><button class="cta" id="cta" ${ctaDisabled?"disabled":""}>${ctaLabel}</button></div></div>`;
  $("#quit").onclick=close;
}

function renderQ(){
  const q=L.qs[L.i]; L.state="answer"; L.sel=null;
  if(q.t==="mc"){
    L.order=shuffle(q.a.map((_,i)=>i));
    shell(`<div class="qtype">בחר את התשובה הנכונה</div><h2 class="qtext">${esc(q.q)}</h2>
      <div class="opts">${L.order.map((ai,k)=>`<button class="opt" data-a="${ai}"><span class="k">${k+1}</span>${esc(q.a[ai])}</button>`).join("")}</div>`,"בדיקה",true);
    bindOpts();
  } else if(q.t==="tf"){
    shell(`<div class="qtype">נכון או לא נכון?</div><h2 class="qtext">${esc(q.q)}</h2>
      <div class="opts"><button class="opt" data-a="1"><span class="k">1</span>נכון</button><button class="opt" data-a="0"><span class="k">2</span>לא נכון</button></div>`,"בדיקה",true);
    bindOpts();
  } else renderMatch(q);
  $("#cta").onclick=onCta;
}
function bindOpts(){
  document.querySelectorAll(".opts .opt").forEach(b=>b.onclick=()=>{
    if(L.state!=="answer")return;
    document.querySelectorAll(".opts .opt").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); L.sel=+b.dataset.a; $("#cta").disabled=false;
  });
}
function renderMatch(q){
  const left=shuffle(q.p.map((p,i)=>({i,s:p[0]}))), right=shuffle(q.p.map((p,i)=>({i,s:p[1]})));
  L.m={pick:null,left:0,miss:false,done:0};
  shell(`<div class="qtype">התאמת זוגות</div><h2 class="qtext">${esc(q.q)}</h2>
    <div class="match"><div class="col">${left.map(x=>`<button class="opt" data-side="L" data-i="${x.i}">${esc(x.s)}</button>`).join("")}</div>
    <div class="col">${right.map(x=>`<button class="opt" data-side="R" data-i="${x.i}">${esc(x.s)}</button>`).join("")}</div></div>`,"המשך",true);
  document.querySelectorAll(".match .opt").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("gone"))return;
    const m=L.m;
    if(!m.pick||m.pick.dataset.side===b.dataset.side){ if(m.pick)m.pick.classList.remove("sel"); m.pick=b; b.classList.add("sel"); return; }
    const a=m.pick,c=b; m.pick=null;
    if(a.dataset.i===c.dataset.i){ beep(true);
      [a,c].forEach(x=>{x.classList.remove("sel");x.classList.add("right");setTimeout(()=>{x.classList.remove("right");x.classList.add("gone");x.disabled=true;},350);});
      if(++m.done===q.p.length){ L.state="checked"; finishAnswer(!m.miss, m.miss?"היו כמה טעויות בדרך.":"התאמה מושלמת."); }
    } else { beep(false); m.miss=true;
      [a,c].forEach(x=>{x.classList.remove("sel");x.classList.add("wrong");setTimeout(()=>x.classList.remove("wrong"),450);});
    }
  });
}
function onCta(){
  if(L.state==="answer") return check();
  if(L.state==="checked") return next();
  if(L.state==="result") return close();
}
function check(){
  const q=L.qs[L.i]; if(L.sel===null)return;
  const ok = q.t==="mc" ? L.sel===q.c : (L.sel===1)===q.c;
  const correctVal = q.t==="mc" ? q.c : (q.c?1:0);
  document.querySelectorAll(".opts .opt").forEach(b=>{b.disabled=true;
    if(+b.dataset.a===correctVal) b.classList.add("right"); else if(b.classList.contains("sel")) b.classList.add("wrong");});
  L.state="checked"; beep(ok);
  finishAnswer(ok,q.e);
}
function finishAnswer(ok,expl){
  const q=L.qs[L.i];
  if(ok){L.right++;} else { L.mistakes.push(q); S.hearts=Math.max(0,S.hearts-1); save(); }
  const cb=$("#cb"); cb.classList.add(ok?"ok":"no");
  const praise=["מצוין!","בול!","יפה מאוד!","בדיוק!"][Math.random()*4|0];
  let answerLine="";
  if(!ok&&q.t==="mc") answerLine=`<span><b>התשובה:</b> ${esc(q.a[q.c])}</span>`;
  if(!ok&&q.t==="tf") answerLine=`<span><b>התשובה:</b> ${q.c?"נכון":"לא נכון"}</span>`;
  $("#fb").innerHTML=`<strong>${ok?praise:"לא בדיוק"}</strong>${answerLine}<span>${esc(expl||"")}</span>`;
  const cta=$("#cta"); cta.disabled=false; cta.textContent="המשך"; cta.focus();
  document.querySelector(".lesson-top .hearts span").textContent=S.hearts;
}
function next(){
  if(S.hearts<=0){ return outOfHearts(); }
  L.i++;
  // mistakes get re-asked once at the end, Duolingo-style
  if(L.i===L.qs.length && L.mistakes.length && !L.review){ L.review=true; L.qs=L.qs.concat(L.mistakes.filter(q=>q.t!=="match")); L.mistakes=[]; }
  if(L.i>=L.qs.length) return result();
  renderQ();
}
function result(){
  const id=lid(COURSE[L.ui],L.li);
  const base=10, bonus=L.right===L.qs.length?5:0, gained=base+L.right*2+bonus;
  S.xp+=gained; S.daily.xp+=gained; S.done[id]=(S.done[id]||0)+1;
  const t=todayStr(); if(S.last!==t){ const diff=S.last?(new Date(t)-new Date(S.last))/864e5:99; S.streak=diff===1?S.streak+1:1; S.last=t; }
  save(); L.state="result";
  const acc=Math.round(L.right/L.qs.length*100);
  shell(`<div class="result"><svg class="mascot" style="width:110px;height:110px" viewBox="0 0 64 64"><use href="#helmet"/></svg>
    <h2>השיעור הושלם!</h2><p>${esc(COURSE[L.ui].lessons[L.li].name)}</p>
    <div class="tiles"><div class="tile"><small>XP</small><b>+${gained}</b></div><div class="tile"><small>דיוק</small><b>${acc}%</b></div><div class="tile"><small>רצף</small><b>${S.streak}</b></div></div></div>`,"חזרה למסלול",false);
  $("#cta").onclick=onCta; beep(true);
}
function outOfHearts(){
  L.state="result";
  shell(`<div class="result"><svg class="mascot" style="width:100px;height:100px" viewBox="0 0 64 64"><use href="#helmet"/></svg>
    <h2 style="color:var(--bad)">נגמרו הלבבות</h2><p>הלבבות יתמלאו מחר. בינתיים אפשר לעבור על החומר שוב.</p></div>`,"חזרה למסלול",false);
  $("#cta").onclick=onCta;
}
function showNoHearts(){
  L={qs:[1],i:1,state:"result"}; $("#lesson").hidden=false; outOfHearts();
}

/* keyboard: 1-4 to choose, Enter to check/continue, Esc to quit */
document.addEventListener("keydown",e=>{
  if(!L||$("#lesson").hidden)return;
  if(e.key==="Escape")return close();
  if(e.key==="Enter"){ const c=$("#cta"); if(c&&!c.disabled){e.preventDefault();c.click();} return; }
  const n=parseInt(e.key,10); if(n>=1&&n<=4&&L.state==="answer"){ const b=document.querySelectorAll(".opts .opt")[n-1]; if(b)b.click(); }
});

renderHome();
</script>
